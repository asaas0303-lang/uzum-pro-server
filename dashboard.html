<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Uzum Market Seller Mini App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#00ffa3',
            brandDark: '#00cc82',
            darkBg: '#0b0f19',
            darkCard: '#151c2c',
            darkBorder: '#1e293b'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 4px;
    }

      background: #1e293b;
      border-radius: 4px;
    }

      box-shadow: 0 0 15px rgba(0, 255, 163, 0.15);

      box-shadow: 0 0 8px rgba(0, 255, 163, 0.4);

</head>
<body class="safe-top safe-bottom select-none">

  <!-- Main Container -->
  <div class="max-w-[430px] mx-auto min-h-screen bg-darkBg flex flex-col relative pb-20 border-x border-darkBorder">
    
    <!-- Top Header -->
    <header class="p-4 bg-darkCard border-b border-darkBorder sticky top-0 z-50 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-2.5 h-2.5 rounded-full bg-brand badge-glow animate-pulse"></div>
          <span class="text-xs uppercase tracking-widest text-slate-400 font-mono">UZUM PRO SELLER</span>
        </div>
        <div class="flex items-center gap-2">
          <!-- Refresh button -->
          <button onclick="refreshData()" class="p-1.5 rounded-lg bg-darkBg border border-darkBorder text-slate-300 hover:text-brand transition">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          </button>
          <!-- API Status Badge -->
          <span id="api-status-badge" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 font-mono">
            Demo Mode
          </span>
        </div>
      </div>

      <!-- Shop Selector & Settings -->
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-400">Do'koningizni tanlang:</span>
          <button onclick="toggleModal('shop-settings-modal')" class="text-xs text-brand hover:underline flex items-center gap-1">
            <i data-lucide="settings" class="w-3.5 h-3.5"></i> Do'konlar
          </button>
        </div>
        <!-- Shop Pills Container -->
        <div id="shop-pills" class="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
          <!-- Dynamically populated -->
        </div>
      </div>
    </header>

    <!-- Main Content Area (Dynamic Views) -->
    <main class="flex-1 p-4" id="main-view">
      <!-- Active view content injected here -->
    </main>

    <!-- App Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-darkCard/95 backdrop-blur-md border-t border-darkBorder grid grid-cols-5 py-2 px-1 z-50">
      <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-brand transition py-1">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span class="text-[9px]">Dashboard</span>
      </button>
      <button onclick="switchTab('products')" id="tab-products" class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-brand transition py-1">
        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        <span class="text-[9px]">Kartochkalar</span>
      </button>
      <button onclick="switchTab('inventory')" id="tab-inventory" class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-brand transition py-1">
        <i data-lucide="package" class="w-5 h-5"></i>
        <span class="text-[9px]">Uy Zaxirasi</span>
      </button>
      <button onclick="switchTab('finance')" id="tab-finance" class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-brand transition py-1 py-1">
        <i data-lucide="trending-up" class="w-5 h-5"></i>
        <span class="text-[9px]">Moliya</span>
      </button>
      <button onclick="switchTab('lounge')" id="tab-lounge" class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-brand transition py-1">
        <i data-lucide="bot" class="w-5 h-5"></i>
        <span class="text-[9px]">AI & Bot</span>
      </button>
    </nav>

    <!-- Dynamic Modal System -->
    <div id="modal-container" class="fixed inset-0 bg-black/75 z-[100] flex items-center justify-center p-4 hidden backdrop-blur-sm">
      <div class="bg-darkCard border border-darkBorder rounded-2xl w-full max-w-[380px] accent-glow flex flex-col max-h-[90vh] overflow-hidden">
        <!-- Header -->
        <div class="p-4 border-b border-darkBorder flex items-center justify-between bg-darkBg/50">
          <h3 id="modal-title" class="font-medium text-slate-200">Modal Title</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <!-- Body -->
        <div id="modal-body" class="p-4 overflow-y-auto flex-1">
          <!-- Content injected here -->
        </div>
      </div>
    </div>

  </div>

  <script>
    // State management using elegant LocalStorage bindings
    const defaultShops = [
      { shopId: 61122, shopTitle: "kamera" },
      { shopId: 48589, shopTitle: "Jaydari Bozor" },
      { shopId: 63592, shopTitle: "Nurli" }
    ];

    const defaultProductTypes = [
      { id: 't1', name: 'A9 kamera', stock: 400, cost: 45000 },
      { id: 't2', name: 'X5 kamera', stock: 300, cost: 95000 },
      { id: 't3', name: 'To\'rt burchak', stock: 150, cost: 180000 }
    ];

    const defaultSkuMappings = {
      '5501': 't1', // Mini WiFi Kamera (Oq) -> A9 Kamera
      '5502': 't1', // Yashirin Kamera HD (Qora) -> A9 Kamera
      '5503': 't1', // Kuzatuv WiFi Kamerasi -> A9 Kamera
      '5601': 't2', // X5 Mini -> X5 Kamera
      '5602': 't2', // X5 Portativ -> X5 Kamera
      '5701': 't3', // To'rtburchak Simsiz -> To'rt burchak
      '5702': 't3'  // Kvadrat Kamera -> To'rt burchak
    };

    const defaultCosts = {
      '5501': { budget: 15000, size: 'МГТ' },
      '5502': { budget: 20000, size: 'МГТ' },
      '5503': { budget: 25000, size: 'МГТ' },
      '5601': { budget: 12000, size: 'МГТ' },
      '5602': { budget: 0, size: 'МГТ' },
      '5701': { budget: 8000, size: 'СГТ' },
      '5702': { budget: 22000, size: 'СГТ' }
    };

    // 12A: pul/son formatlash — YAGONA funksiya. `toLocaleString('uz-UZ')` kasr sonda vergulni O'NLIK
    // ajratkich sifatida ishlatadi (masalan 121.111 -> "121,111"), bu ming ajratkichiga o'xshab noto'g'ri
    // o'qiladi (121 emas, 121 ming deb tushunilishi mumkin). Shuning uchun HAR DOIM avval Math.round().
    // Butun loyihada FAQAT shu funksiya ishlatilsin — xom toLocaleString() qolmasin.
    function fmtMoney(n) {
      return Math.round(n || 0).toLocaleString('uz-UZ');
    }
    function fmtPct(n) {
      return (n || 0).toFixed(1);
    }

    let state = {
      shops: JSON.parse(localStorage.getItem('uz_shops')) || defaultShops,
      activeShop: parseInt(localStorage.getItem('uz_active_shop')) || 61122,
      productTypes: JSON.parse(localStorage.getItem('uz_product_types')) || defaultProductTypes,
      skuMappings: JSON.parse(localStorage.getItem('uz_sku_mappings')) || defaultSkuMappings,
      costs: JSON.parse(localStorage.getItem('uz_costs')) || defaultCosts,
      productSettings: JSON.parse(localStorage.getItem('uz_product_settings')) || {}, // 3.4: mahsulot darajasidagi sozlama
      productFilter: localStorage.getItem('uz_product_filter') || 'active', // Kartochkalar filtri: 'active'|'all'|'banned'|'depleted'
      cachedUzumProducts: null,
      orders: [],
      expenses: [],
      returns: [],
      dataErrors: { products: null, orders: null, expenses: null },
      unavailableShops: [], // Uzum "Shop is not available" (403) bergan do'kon ID'lari
      activeTab: 'dashboard',
      aiResults: null,
      aiLoading: false,
      skuMetrics: null, // 5.1/5.2/5.4: /api/metrics/:shopId natijasi (joriy do'kon)
      financeSummary: null, // B1/14C: /api/period-report/:shopId?period=... natijasi (joriy do'kon)
      financePeriod: localStorage.getItem('uz_finance_period') || 'month', // 14C: Moliya va D4 bir xil davrni ulashadi
      financeLoading: false, // 14C3: davr almashtirilganda ("Bugun" uzoqroq turishi mumkin)
      forecast: null, // E: /api/forecast/:shopId natijasi (joriy do'kon)
      showAllShops: false, // 6.3: Dashboard "Barcha do'konlar" birlashtirilgan ko'rinishi
      allShopsSummary: null,
      allShopsLoading: false,
      // 18-A: MOLIYA ma'lumotlari (serverdan yuklanadi, faqat aniq harakat bilan yoziladi)
      withdrawals: [], // { id, date, amount, shopId?, note, status }
      userExpenses: [], // { id, date, amount, category, note }
      credits: [], // { id, name, totalAmount, remainingAmount, monthlyPayment, nextPaymentDate, interestRate?, endDate?, remainingPayments?, type, note }
      goals: [], // { id, type, target, createdDate }
      cashFlow: null, // 18-B: /api/cash-flow natijasi
      compensation: null, // 19-C: /api/compensation-candidates natijasi
      invoices: null // 19-D: /api/invoices (ta'minlashlar) natijasi
    };

    // FAQAT foydalanuvchi sozlamalarini serverga yuboradi (do'kon/tannarx/bog'lanish).
    // Bu mahsulot fetch'idan MUTLAQO mustaqil — Uzum API xato bersa ham sozlamalar saqlanadi.
    async function syncSettingsToServer() {
      // B (frontend himoya): bo'sh/deyarli bo'sh sozlamani (0 do'kon VA 0 productType) YUBORMAYMIZ —
      // aks holda serverdagi to'liq sozlamani o'chirib yuborishi mumkin.
      if ((state.shops || []).length === 0 && (state.productTypes || []).length === 0) {
        console.warn("[SETTINGS] Bo'sh sozlama — serverga yuborilmadi (himoya).");
        return;
      }
      try {
        await fetch('/api/sync-state', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            productTypes: state.productTypes,
            skuMappings: state.skuMappings,
            costs: state.costs,
            productSettings: state.productSettings,
            shops: state.shops,
            activeShop: state.activeShop
          })
        });
      } catch(e) {
        console.error("Sozlamalarni serverga sync qilish muvaffaqiyatsiz:", e);
      }
    }

    // 15: SERVER HAR DOIM USTUVOR. Hech qanday "ko'proq elementli = to'g'riroq" merge YO'Q — bu
    // eski mantiq xato edi (14-bosqichdan keyin: brauzerdagi eski localStorage 3 do'konli holatni
    // "to'liqroq" deb hisoblab, allaqachon o'chirilgan Nurli'ni serverga qaytarib qo'ygan edi).
    // Endi: server javob bersa — UNING holati ishlatiladi, nuqta (bo'sh bo'lsa ham). localStorage
    // FAQAT server bilan bog'lanib bo'lmagan holatda (masalan internet yo'q) zaxira sifatida —
    // bu holatda state allaqachon skript boshida localStorage'dan yuklangan, shu holicha qoladi.
    // localStorage'ga bu yerda faqat serverni AKS ETTIRISH uchun yoziladi (keyingi safar zaxira
    // sifatida to'g'ri qiymat tursin) — hech qachon serverga qaytarib yuborilmaydi.
    async function loadServerSettings() {
      try {
        const res = await fetch('/api/settings');
        if (!res.ok) throw new Error(`server /api/settings ${res.status} qaytardi`);
        const srv = await res.json();

        state.shops = srv.shops || [];
        state.productTypes = srv.productTypes || [];
        state.skuMappings = srv.skuMappings || {};
        state.costs = srv.costs || {};
        state.productSettings = srv.productSettings || {};
        // 18-A: moliya ma'lumotlari — server manba
        state.withdrawals = srv.withdrawals || [];
        state.userExpenses = srv.userExpenses || [];
        state.credits = srv.credits || [];
        state.goals = srv.goals || [];
        if (srv.activeShop && state.shops.find(s => s.shopId === srv.activeShop)) {
          state.activeShop = srv.activeShop;
        } else if (state.shops.length > 0 && !state.shops.find(s => s.shopId === state.activeShop)) {
          state.activeShop = state.shops[0].shopId;
        }

        localStorage.setItem('uz_shops', JSON.stringify(state.shops));
        localStorage.setItem('uz_active_shop', state.activeShop);
        localStorage.setItem('uz_product_types', JSON.stringify(state.productTypes));
        localStorage.setItem('uz_sku_mappings', JSON.stringify(state.skuMappings));
        localStorage.setItem('uz_costs', JSON.stringify(state.costs));
        localStorage.setItem('uz_product_settings', JSON.stringify(state.productSettings));
        console.log(`[SETTINGS] Serverdan yuklandi (manba sifatida): ${state.shops.length} do'kon, ${state.productTypes.length} tur, ${Object.keys(state.skuMappings).length} SKU bog'lanish.`);
      } catch (e) {
        console.error("Server sozlamalarini o'qib bo'lmadi — localStorage zaxira sifatida ishlatiladi (offline holat):", e);
        // state skript boshida localStorage'dan yuklangan — shu holicha qoladi, qo'shimcha ish kerak emas
      }
    }

    // Same metric logic used by dashboard.html (simulator) and index.js (bot report) — keep both in sync
    function buildReportMetrics(orders, expenses, productTypes, skuMappings, products) {
      const ordersCount = orders.length;
      const soldQty = orders.reduce((acc, o) => acc + (o.quantity || 1), 0);
      const revenue = orders.reduce((acc, o) => acc + (o.price * (o.quantity || 1)), 0);

      let profitSum = 0;
      let unmappedCount = 0;
      orders.forEach(o => {
        const type = productTypes.find(t => t.id === skuMappings[o.skuId]);
        if (type) {
          profitSum += (o.payout || 0) - (type.cost * (o.quantity || 1));
        } else {
          unmappedCount++;
        }
      });

      const withdrawable = orders
        .filter(o => o.status === 'DELIVERED')
        .reduce((acc, o) => acc + (o.payout || 0), 0);

      const expenseByType = { STORAGE: 0, LOGISTICS: 0, MARKETING: 0 };
      expenses.forEach(x => {
        if (expenseByType[x.type] !== undefined) expenseByType[x.type] += x.amount;
      });
      const totalExpenses = expenseByType.STORAGE + expenseByType.LOGISTICS + expenseByType.MARKETING;

      let activeCount = products.length;
      let outOfStockCount = 0;
      let alertCount = 0;
      let blockedCount = 0;
      const urgentItems = [];

      products.forEach(p => {
        if (p.status?.value === 'PERM_BANNED') blockedCount++;
        (p.skuList || []).forEach(sku => {
          const qty = Math.max(0, sku.availableAmount || 0); // 13.1: manfiy zaxira 0
          if (qty === 0) outOfStockCount++;
          if (qty > 0 && qty < 15) alertCount++;

          const type = productTypes.find(t => t.id === skuMappings[sku.skuId]);
          if (qty === 0 && type && type.stock > 0) {
            urgentItems.push(`${type.name}: ${sku.skuTitle} o'rniga uy zaxirasidan yuboring (Hozir Uzum omborida: 0 dona, Uyda: ${type.stock} dona kutilmoqda)`);
          }
        });
      });

      return { ordersCount, soldQty, revenue, profitSum, unmappedCount, withdrawable, expenseByType, totalExpenses, activeCount, outOfStockCount, alertCount, blockedCount, urgentItems };
    }

    // Builds the exact Telegram report text from live dashboard state (same shape as backend generateReportText)
    function buildReportText() {
      const todayStr = new Date().toISOString().split('T')[0];
      const products = state.cachedUzumProducts || [];
      const m = buildReportMetrics(state.orders, state.expenses, state.productTypes, state.skuMappings, products);

      const urgentSection = m.urgentItems.length
        ? `\n🚨 *ZUDLIK BILAN OMBORGA YUBORING:*\n${m.urgentItems.map(t => `• ${t}`).join('\n')}\n`
        : '';

      return `🟣 *Uzum Pro Dashboard*
Assalomu alaykum!

📅 *${todayStr}* uchun hisobot

📦 Qabul qilingan buyurtmalar: ${m.ordersCount} ta
🛍️ Sotilgan tovarlar: ${m.soldQty} ta
🏦 Daromad: ${fmtMoney(m.revenue)} so'm
💵 Sof foyda: ${fmtMoney(m.profitSum)} so'm${m.unmappedCount > 0 ? ` (bog'lanmagan: ${m.unmappedCount} ta buyurtma hisobga kirmadi)` : ''}

💰 Yechib olish mumkin (yetkazilgan buyurtmalar bo'yicha): ${fmtMoney(m.withdrawable)} so'm

💸 Xarajatlar (jami ${fmtMoney(m.totalExpenses)} so'm):
  ➤ Logistika: ${fmtMoney(m.expenseByType.LOGISTICS)} so'm
  ➤ Saqlash: ${fmtMoney(m.expenseByType.STORAGE)} so'm
  ➤ Marketing: ${fmtMoney(m.expenseByType.MARKETING)} so'm

📦 Tovarlar holati:
✅ Sotuvda: ${m.activeCount} ta tovar
❌ Ogohlantirish (Tugagan): ${m.outOfStockCount} ta SKU
⚠️ Kam qolgan: ${m.alertCount} ta SKU
🚫 Bloklangan: ${m.blockedCount} ta
${urgentSection}
/start — boshlash
/hisobot — hisobot
/dashboard — mini app ochish`;
    }

    function saveState() {
      localStorage.setItem('uz_shops', JSON.stringify(state.shops));
      localStorage.setItem('uz_active_shop', state.activeShop);
      localStorage.setItem('uz_product_types', JSON.stringify(state.productTypes));
      localStorage.setItem('uz_sku_mappings', JSON.stringify(state.skuMappings));
      localStorage.setItem('uz_costs', JSON.stringify(state.costs));
      localStorage.setItem('uz_product_settings', JSON.stringify(state.productSettings));
      syncSettingsToServer(); // sozlamalar — fetch'dan mustaqil, har doim yuboriladi
    }

    // Helper functions
    function getActiveShopName() {
      const idx = state.shops.find(s => s.shopId === state.activeShop);
      return idx ? idx.shopTitle : 'Uzum Store';
    }

    // 3.1/3.4: Komissiya ustuvorligi — (a) SKU qo'lda, (b) mahsulot qo'lda, (c) SKU/API commissionApi, (d) 18% default.
    // Eski kategoriya-taxmini (17/20/25%) butunlay olib tashlandi — noto'g'ri edi.
    // Qaytaradi: { pct, source } — source: 'sku-manual'|'product-manual'|'api'|'default'
    function resolveCommission(skuId, sku, productId) {
      const c = state.costs[skuId];
      if (c && c.commissionPercent != null && c.commissionPercent !== '') return { pct: Number(c.commissionPercent), source: 'sku-manual' };
      const ps = productId != null ? state.productSettings[productId] : null;
      if (ps && ps.commissionPercent != null && ps.commissionPercent !== '') return { pct: Number(ps.commissionPercent), source: 'product-manual' };
      if (sku && sku.commissionApi != null) return { pct: Number(sku.commissionApi), source: 'api' };
      return { pct: 18, source: 'default' };
    }

    // 4.1: Uzum'ning 2026-05-04'dan beri ishlatayotgan hajm-asosli logistika formulasi.
    // 1 litrgacha 5250 so'm, har qo'shimcha litr +250 so'm, maksimal 50000 so'm. Hajm yuqoriga yaxlitlanadi.
    function logisticsFormula(litr) {
      return Math.min(50000, 5250 + 250 * (Math.ceil(litr) - 1));
    }

    // Hajm manbai ustuvorligi (4.1): SKU qo'lda litr > mahsulot qo'lda litr > Uzum API'ning o'z
    // SKU o'lchami (dimensionMm) > yo'q (chaqiruvchi default 1 litr ishlatadi).
    function resolveVolumeL(skuId, productId, sku) {
      const c = state.costs[skuId];
      if (c && c.volumeL != null && c.volumeL !== '' && Number(c.volumeL) > 0) return { litr: Number(c.volumeL), source: 'sku-volume' };
      const ps = productId != null ? state.productSettings[productId] : null;
      if (ps && ps.volumeL != null && ps.volumeL !== '' && Number(ps.volumeL) > 0) return { litr: Number(ps.volumeL), source: 'product-volume' };
      if (sku && sku.dimensionMm) {
        const { length, width, height } = sku.dimensionMm;
        const litr = (length * width * height) / 1000000;
        if (litr > 0) return { litr, source: 'api-dimension' };
      }
      return null;
    }

    // 3.2/3.4/4.1: Logistika — SKU qo'lda narx > mahsulot qo'lda narx > hajm (qo'lda yoki API) > default (hajm yo'q, 1 litr).
    // Qaytaradi: { val, source, litr? }
    function resolveLogistics(skuId, productId, sku) {
      const c = state.costs[skuId];
      if (c && c.logisticsCost != null && c.logisticsCost !== '') return { val: Number(c.logisticsCost), source: 'sku-manual' };
      const ps = productId != null ? state.productSettings[productId] : null;
      if (ps && ps.logisticsCost != null && ps.logisticsCost !== '') return { val: Number(ps.logisticsCost), source: 'product-manual' };
      const vol = resolveVolumeL(skuId, productId, sku);
      if (vol) return { val: logisticsFormula(vol.litr), source: vol.source, litr: vol.litr };
      return { val: 5250, source: 'default', litr: 1 };
    }

    // 4.2: Saqlash xarajati — 1 litr = 12 so'm/kun, 30 kun. Hajm bo'lmasa 1 litr deb hisoblanadi.
    const STORAGE_SOM_PER_LITER_DAY = 12;
    const STORAGE_DEFAULT_DAYS = 30;
    function resolveStorage(skuId, productId, sku) {
      const vol = resolveVolumeL(skuId, productId, sku);
      const litr = vol ? vol.litr : 1;
      const source = vol ? vol.source : 'default';
      const days = STORAGE_DEFAULT_DAYS;
      return { val: litr * STORAGE_SOM_PER_LITER_DAY * days, source, litr, days };
    }

    // 3.4/3.5: Tannarx manbai ustuvorligi — SKU qo'lda > SKU turi > mahsulot qo'lda > mahsulot turi > bog'lanmagan
    // Qaytaradi: { tannarx, source, type, tracksStock }
    function resolveTannarx(skuId, productId) {
      const skuCost = state.costs[skuId];
      if (skuCost && skuCost.manualCost != null && skuCost.manualCost !== '') {
        return { tannarx: Number(skuCost.manualCost), source: 'sku-manual', type: null, tracksStock: false };
      }
      const skuTypeId = state.skuMappings[skuId];
      if (skuTypeId) {
        const type = state.productTypes.find(t => t.id === skuTypeId);
        if (type) return { tannarx: type.cost, source: 'sku-type', type, tracksStock: true };
      }
      const ps = productId != null ? state.productSettings[productId] : null;
      if (ps) {
        if (ps.manualCost != null && ps.manualCost !== '') return { tannarx: Number(ps.manualCost), source: 'product-manual', type: null, tracksStock: false };
        if (ps.mappedTypeId) {
          const type = state.productTypes.find(t => t.id === ps.mappedTypeId);
          if (type) return { tannarx: type.cost, source: 'product-type', type, tracksStock: true };
        }
      }
      return { tannarx: 0, source: 'unmapped', type: null, tracksStock: false };
    }

    // Manba belgisi: 📦 = mahsulot darajasidan meros, ✏️ = qo'lda kiritilgan (shu darajada)
    function sourceBadge(source) {
      if (source === 'sku-manual') return ' ✏️';
      if (source === 'product-manual') return ' 📦✏️';
      if (source === 'product-type') return ' 📦';
      if (source === 'product-volume') return ' 📦';
      if (source === 'api-dimension') return ' 📐';
      return '';
    }

    // "Asl tovar turi" qatorida ko'rsatiladigan matn (3.4/3.5)
    function tannarxLabel(info) {
      if (info.source === 'sku-manual' || info.source === 'product-manual') {
        return `✍️ Qo'lda: ${fmtMoney(info.tannarx)} so'm${sourceBadge(info.source)}`;
      }
      if (info.source === 'sku-type' || info.source === 'product-type') {
        return `${info.type.name}${sourceBadge(info.source)}`;
      }
      return "Kanalga bog'lanmagan ⚠️";
    }


    // SKU'ning zaxira kunlari metrikasi (5.1) — eng ishonchli mavjud ko'rsatkich (30 kunlik, bo'lmasa 7 kunlik)
    function skuStockDays(skuId) {
      const m = state.skuMetrics?.perSku?.[skuId];
      if (!m || !m.canCompute) return null;
      return m.stockDays30 != null ? m.stockDays30 : m.stockDays7;
    }

    // Kartochkalar filtri (Uzum ilovasidagidek): mahsulot berilgan filtrga tushadimi?
    function productMatchesFilter(p, filter) {
      const isBanned = p.status?.value === 'PERM_BANNED';
      const anyInStock = (p.skuList || []).some(s => (s.availableAmount || 0) > 0);
      const allOut = (p.skuList || []).every(s => (s.availableAmount || 0) <= 0);
      switch (filter) {
        case 'active': return !isBanned && anyInStock;   // Sotuvda
        case 'banned': return isBanned;                  // Bloklangan
        case 'depleted': return !isBanned && allOut;     // Tugagan
        case 'urgent-stock':                              // 5.1: tugash arafasida (<7 kun)
          return !isBanned && (p.skuList || []).some(s => { const d = skuStockDays(s.skuId); return d != null && d < 7; });
        case 'rank-a': return (p.skuList || []).some(s => s.rank === 'A'); // 5.2
        case 'rank-c': return (p.skuList || []).some(s => s.rank === 'C'); // 5.2
        case 'all':
        default: return true;                            // Barcha tovarlar
      }
    }

    // Mahsulotning umumiy zaxirasi (barcha SKU'lar yig'indisi). 13.1: manfiy zaxira 0 deb olinadi.
    function productTotalStock(p) {
      return (p.skuList || []).reduce((acc, s) => acc + Math.max(0, s.availableAmount || 0), 0);
    }

    // Filtrni tanlash: state + localStorage'da saqlanadi, tab almashtirilganda yo'qolmaydi
    function setProductFilter(filter) {
      state.productFilter = filter;
      localStorage.setItem('uz_product_filter', filter);
      renderProducts(document.getElementById('main-view'));
    }

    // Server API Fetcher
    async function fetchFromProxy(endpoint) {
      const headers = {};
      const token = localStorage.getItem('uzum_api_token');
      if (token) {
        headers['Authorization'] = token;
      }
      const response = await fetch(endpoint, { headers });
      const data = await response.json().catch(() => null);
      if (!response.ok) {
        // Backend 502 UZUM_API_ERROR bilan aniq sabab qaytaradi — shuni ko'rsatamiz
        const detail = (data && data.detail) ? data.detail : `HTTP ${response.status}`;
        throw new Error(detail);
      }
      return data;
    }

    function setBadge(state_, cls) {
      const badge = document.getElementById('api-status-badge');
      badge.textContent = state_;
      badge.className = `text-[10px] px-2 py-0.5 rounded-full font-mono ${cls}`;
    }

    async function refreshData() {
      document.getElementById('api-status-badge').classList.add('animate-pulse');
      state.dataErrors = { products: null, orders: null, expenses: null };

      // 15: sozlamalar BU YERDA avtomatik serverga yuborilmaydi — refreshData() faqat jonli
      // ma'lumot o'qiydi. Sozlamalar faqat aniq foydalanuvchi harakati (saveState()) orqali yoziladi.

      // Mahsulotlar — badge asosan shu chaqiruvga qarab belgilanadi
      try {
        const pData = await fetchFromProxy(`/api/uzum/product/shop/${state.activeShop}`);
        state.cachedUzumProducts = pData.payload || [];
        // Do'kon ishlaydi — agar avval "mavjud emas" deb belgilangan bo'lsa, olib tashlaymiz
        state.unavailableShops = state.unavailableShops.filter(id => id !== state.activeShop);
        if (pData.source === 'live') {
          setBadge('Live Connected', 'bg-emerald-950/80 border border-emerald-500/50 text-emerald-300 badge-glow');
        } else {
          setBadge('Demo Mode', 'bg-slate-800 border border-slate-700 text-slate-300');
        }
      } catch (e) {
        console.error("Mahsulotlarni yuklashda xato:", e);
        state.cachedUzumProducts = null;
        state.dataErrors.products = e.message;
        // Uzum "Shop is not available" bersa — do'konni "mavjud emas" deb belgilaymiz
        if (/not available|forbidden|403/i.test(e.message || '') && !state.unavailableShops.includes(state.activeShop)) {
          state.unavailableShops.push(state.activeShop);
        }
        setBadge("⚠️ Ma'lumot yo'q", 'bg-rose-950/80 border border-rose-500/50 text-rose-300');
      }

      // Sana oralig'i: oxirgi 30 kun
      const dateTo = new Date().toISOString().split('T')[0];
      const dateFrom = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
      const financeQuery = `shopIds=${state.activeShop}&dateFrom=${dateFrom}&dateTo=${dateTo}`;

      // Har bir bo'lim mustaqil yuklanadi — bittasi qulasa, boshqalari baribir urinib ko'radi
      try {
        const oData = await fetchFromProxy(`/api/uzum/finance/orders?${financeQuery}`);
        state.orders = oData.payload?.orders || [];
      } catch (e) {
        console.error("Buyurtmalarni yuklashda xato:", e);
        state.orders = [];
        state.dataErrors.orders = e.message;
      }

      try {
        const eData = await fetchFromProxy(`/api/uzum/finance/expenses?${financeQuery}`);
        state.expenses = eData.payload || [];
      } catch (e) {
        console.error("Xarajatlarni yuklashda xato:", e);
        state.expenses = [];
        state.dataErrors.expenses = e.message;
      }

      try {
        // 5.1/5.2/5.4: zaxira kunlari, ABC, Xitoy buyurtma nuqtasi — snapshot tarixidan (server hisoblaydi)
        state.skuMetrics = await fetchFromProxy(`/api/metrics/${state.activeShop}`);
      } catch (e) {
        console.error("Metrikalarni yuklashda xato:", e);
        state.skuMetrics = null;
      }

      try {
        // B1/14C: Moliya bo'limi — snapshot delta'ga asoslangan xulosa, tanlangan davr bo'yicha
        // (finance/orders doim bo'sh bo'lgani uchun). Moliya va D4 shu bitta davr state'ini ulashadi.
        state.financeSummary = await fetchFromProxy(`/api/period-report/${state.activeShop}?period=${state.financePeriod}`);
      } catch (e) {
        console.error("Moliya xulosasini yuklashda xato:", e);
        state.financeSummary = null;
      }

      try {
        // E: keyingi 30 kunlik bashorat, ishonch darajasi bilan
        state.forecast = await fetchFromProxy(`/api/forecast/${state.activeShop}`);
      } catch (e) {
        console.error("Bashoratni yuklashda xato:", e);
        state.forecast = null;
      }

      // 18-B: naqd oqim (yechilgan/xarajat/kredit + proyeksiya)
      await loadCashFlow();
      // 19-C: kompensatsiya nomzodlari (yo'qolgan/rad etilgan tovar)
      await loadCompensation();
      // 19-D: ta'minlashlar (yuk xatlari ro'yxati)
      await loadInvoices();

      // 15: bu yerda avtomatik serverga yozish yo'q (avval syncStateToServer() chaqirilardi —
      // backend baribir products/orders/expenses'ni hech qayerda ishlatmasdi, faqat xotirada
      // saqlardi; bekor qilindi, chunki fon merge/sync tamoman yo'q qilinishi kerak edi).
      renderShopPills();
      switchTab(state.activeTab); // Re-renders current active tab with fresh loads
      document.getElementById('api-status-badge').classList.remove('animate-pulse');
      lucide.createIcons();
    }

      document.getElementById('modal-container').classList.add('hidden');

    // Shop functions
    function renderShopPills() {
      const container = document.getElementById('shop-pills');
      container.innerHTML = state.shops.map(s => {
        const unavailable = state.unavailableShops.includes(s.shopId);
        return `
        <button onclick="changeActiveShop(${s.shopId})" title="${unavailable ? 'Bu do\'kon Uzum API uchun ochilmagan' : ''}" class="shrink-0 px-3 py-1.5 text-xs font-medium rounded-full transition border font-mono ${
          unavailable
            ? 'bg-rose-950/30 border-rose-800 text-rose-300'
            : state.activeShop === s.shopId
              ? 'bg-brand/10 border-brand text-brand badge-glow'
              : 'bg-darkBg border-darkBorder text-slate-400 hover:text-slate-200'
        }">
          ${s.shopTitle}${unavailable ? ' ⚠️' : ''}
        </button>
      `;
      }).join('');
    }

    function changeActiveShop(id) {
      state.activeShop = id;
      saveState();
      refreshData();
    }

    function addShop() {
      const idInput = document.getElementById('new-shop-id');
      const titleInput = document.getElementById('new-shop-title');
      const id = parseInt(idInput.value);
      const title = titleInput.value.trim();

      if (!id || !title) return alert("Iltimos ID va Nomi maydonlarini to'ldiring!");

      state.shops.push({ shopId: id, shopTitle: title });
      idInput.value = '';
      titleInput.value = '';
      saveState();
      toggleModal('shop-settings-modal'); // Refresh
      refreshData();
    }

    function editShopTitle(shopId) {
      const current = state.shops.find(s => s.shopId === shopId);
      if (!current) return;
      const newTitle = prompt("Do'kon uchun yangi nom kiriting:", current.shopTitle);
      if (newTitle && newTitle.trim()) {
        current.shopTitle = newTitle.trim();
        saveState();
        toggleModal('shop-settings-modal'); // Refresh
        refreshData();
      }
    }

    function deleteShop(shopId) {
      if (confirm("Haqiqatan ham ushbu do'konni o'chirmoqchimisiz?")) {
        state.shops = state.shops.filter(s => s.shopId !== shopId);
        if (state.activeShop === shopId && state.shops.length > 0) {
          state.activeShop = state.shops[0].shopId;
        }
        saveState();
        toggleModal('shop-settings-modal'); // Refresh
        refreshData();
      }
    }

      const input = document.getElementById('api-token-field');
      localStorage.setItem('uzum_api_token', input.value.trim());
      alert("Token muvaffaqiyatli saqlandi. Qayta yuklanmoqda...");
      closeModal();
      refreshData();
    }

    // 4.1: uzunlik/kenglik/balandlik (sm) → hajm (litr) avtomatik hisoblash: (u×k×b)/1000
    function calcVolumeFromDims() {
      const l = parseFloat(document.getElementById('sku-dim-l').value) || 0;
      const w = parseFloat(document.getElementById('sku-dim-w').value) || 0;
      const h = parseFloat(document.getElementById('sku-dim-h').value) || 0;
      if (l <= 0 || w <= 0 || h <= 0) return alert("Uzunlik, kenglik va balandlikni kiriting (sm).");
      const litr = (l * w * h) / 1000;
      document.getElementById('sku-volume-input').value = litr.toFixed(2);
    }

    // Tannarx select'ida "Qo'lda kiritish" tanlanganda tannarx maydonini ko'rsatadi/yashiradi
    function onCostModalTypeChange() {
      const val = document.getElementById('sku-map-select').value;
      document.getElementById('sku-manual-cost-wrap').style.display = val === '__manual__' ? '' : 'none';
    }

    // 3.4/3.5: SKU (mode='sku') yoki mahsulot (mode='product') darajasidagi sozlamani saqlaydi
    function saveCostModal() {
      const body = document.getElementById('modal-body');
      const mode = body.dataset.mode;
      const targetId = body.dataset.targetId;

      const selectedValue = document.getElementById('sku-map-select').value;
      const budget = parseInt(document.getElementById('sku-ad-input').value) || 0;
      const comRaw = document.getElementById('sku-commission-input').value.trim();
      const logRaw = document.getElementById('sku-logistics-input').value.trim();
      const volRaw = document.getElementById('sku-volume-input').value.trim();
      const isManual = selectedValue === '__manual__';
      const manualCostInput = document.getElementById('sku-manual-cost-input');
      const manualCostRaw = (isManual && manualCostInput) ? manualCostInput.value.trim() : '';
      const manualCost = (isManual && manualCostRaw !== '') ? Number(manualCostRaw) : null;

      const commissionPercent = comRaw === '' ? null : Number(comRaw);
      const logisticsCost = logRaw === '' ? null : Number(logRaw);
      const volumeL = volRaw === '' ? null : Number(volRaw);

      if (mode === 'sku') {
        if (isManual) {
          delete state.skuMappings[targetId]; // manual va turga bog'lash bir-birini istisno qiladi
        } else if (selectedValue) {
          state.skuMappings[targetId] = selectedValue;
        } else {
          delete state.skuMappings[targetId];
        }
        state.costs[targetId] = { budget, commissionPercent, logisticsCost, manualCost, volumeL };
      } else {
        // 3.4: mahsulot darajasi — barcha ranglarga tarqaladi (4.1: hajm ham meros bo'ladi)
        state.productSettings[targetId] = {
          mappedTypeId: isManual ? null : (selectedValue || null),
          manualCost,
          budget,
          commissionPercent,
          logisticsCost,
          volumeL
        };
      }
      saveState();
      closeModal();
      refreshData();
    }

    // Product types management
    function saveProductType(editId) {
      const name = document.getElementById('type-name').value.trim();
      const cost = parseInt(document.getElementById('type-cost').value);
      const stock = parseInt(document.getElementById('type-stock').value) || 0;

      if (!name || isNaN(cost)) return alert("Iltimos nomi va haqiqiy tannarxini to'ldiring!");

      if (editId) {
        const item = state.productTypes.find(t => t.id === editId);
        if (item) {
          item.name = name;
          item.cost = cost;
          item.stock = stock;
        }
      } else {
        const newType = {
          id: 't_' + Date.now(),
          name,
          cost,
          stock
        };
        state.productTypes.push(newType);
      }
      saveState();
      closeModal();
      switchTab('inventory');
    }

    function deleteProductType(id) {
      if (confirm("Haqiqatan ham ushbu zaxira tovarini o'chirib yuborsiz? Barcha bog'lovlar yo'qoladi.")) {
        state.productTypes = state.productTypes.filter(t => t.id !== id);
        // Clear mapping orphaned references
        for (const sku in state.skuMappings) {
          if (state.skuMappings[sku] === id) {
            delete state.skuMappings[sku];
          }
        }
        saveState();
        switchTab('inventory');
      }
    }

    function renderDashboardUnsafe(root) {
      if (state.showAllShops) { renderAllShopsUnsafe(root); return; } // 6.3
      // Calculate high-fidelity stats
      let activeListings = 0;
      let outOfStockSkuCount = 0;
      let blockedSkuCount = 0;
      let chinaOrdersCount = 0;

      // Warehouse tracking
      let warehouseStockVal = 0;
      let homeStockValue = 0;
      let homeStockQty = 0;

      state.productTypes.forEach(t => {
        homeStockQty += t.stock;
        homeStockValue += (t.stock * t.cost);
      });

      // D1/D2: Uzum omboridagi joriy zaxira soni va qiymati (tannarx/sotilsa/foyda)
      let uzumStockQty = 0, uzumStockTannarx = 0, uzumStockSotilsa = 0, uzumStockFoyda = 0;
      const typeStats = {}; // typeId -> { sumPrice, sumProfit, count } — uy zaxirasi "sotilsa/foyda" taxmini uchun

      // Track mapped inventory to trigger alarms
      const alertItems = [];
      const chinaAlertItems = [];

      // Loop Uzum stock cards
      if (state.cachedUzumProducts) {
        state.cachedUzumProducts.forEach(p => {
          const isBanned = p.status?.value === 'PERM_BANNED';
          if (isBanned) blockedSkuCount++;
          activeListings++;

          p.skuList.forEach(sku => {
            const qty = Math.max(0, sku.availableAmount || 0); // 13.1: manfiy zaxira 0
            if (qty === 0) outOfStockSkuCount++;

            // D1/D2: joriy Uzum zaxirasi qiymati
            const price = sku.purchasePrice || 0;
            const tInfo = resolveTannarx(sku.skuId, p.productId);
            const com = resolveCommission(sku.skuId, sku, p.productId);
            const commission = price * (com.pct / 100);
            const logi = resolveLogistics(sku.skuId, p.productId, sku).val;
            const stor = resolveStorage(sku.skuId, p.productId, sku).val;
            const profitPerUnit = price - commission - logi - stor - tInfo.tannarx; // reklama kiritilmagan
            uzumStockQty += qty;
            uzumStockTannarx += qty * tInfo.tannarx;
            uzumStockSotilsa += qty * price;
            uzumStockFoyda += qty * profitPerUnit;

            // Map checks
            const typeId = state.skuMappings[sku.skuId];
            const matchingType = state.productTypes.find(t => t.id === typeId);
            if (typeId) {
              if (!typeStats[typeId]) typeStats[typeId] = { sumPrice: 0, sumProfit: 0, count: 0 };
              typeStats[typeId].sumPrice += price;
              typeStats[typeId].sumProfit += profitPerUnit;
              typeStats[typeId].count++;
            }

            if (matchingType && qty === 0 && matchingType.stock > 0) {
              alertItems.push({ skuName: sku.skuTitle, typeName: matchingType.name });
            }
            // 5.4: Xitoy buyurtma nuqtasi — real snapshot-based metrikadan (taxminiy dailyRate emas)
            const metric = state.skuMetrics?.perSku?.[sku.skuId];
            if (metric && metric.needsReorder) {
              chinaAlertItems.push({ name: sku.skuTitle });
            }
          });
        });
      }

      // D2: uy zaxirasi "sotilsa/foyda" taxmini — shu do'kondagi bog'langan SKU'larning o'rtacha narxi/foydasidan
      let homeSotilsa = 0, homeFoyda = 0;
      state.productTypes.forEach(t => {
        const stats = typeStats[t.id];
        if (stats && stats.count > 0) {
          homeSotilsa += t.stock * (stats.sumPrice / stats.count);
          homeFoyda += t.stock * (stats.sumProfit / stats.count);
        }
      });

      const alertBadgeCount = alertItems.length + chinaAlertItems.length + blockedSkuCount;

      root.innerHTML = `
        <div class="flex flex-col gap-5">

          ${state.dataErrors?.products ? dataErrorBanner(state.dataErrors.products) : ''}

          <!-- Urgent Alert Notifications Banner -->
          ${alertBadgeCount > 0 ? `
            <div class="rounded-2xl border border-rose-500/20 bg-rose-950/20 p-4">
              <div class="flex items-center gap-2 mb-2 text-rose-400">
                <i data-lucide="bell" class="w-4.5 h-4.5 animate-bounce"></i>
                <span class="text-xs font-bold uppercase tracking-wider">Mavjud Muammolar (${alertBadgeCount}):</span>
              </div>
              <div class="flex flex-col gap-2 mt-2 font-medium">
                ${alertItems.map(item => `
                  <div class="flex items-start gap-2 text-xs text-rose-300">

      let searchVal = document.getElementById('product-search-input')?.value || '';
      const activeFilter = state.productFilter || 'active';
      const allProducts = state.cachedUzumProducts || [];

      let listHTML = '';

      if (state.dataErrors?.products) {
        listHTML = dataErrorBanner(state.dataErrors.products);

          </div>
        `;
      } else {
        // Avval filtr qo'llanadi, keyin qidiruv matni
        let working = allProducts.filter(p => productMatchesFilter(p, activeFilter));
        if (searchVal) {
          working = working.filter(p =>
            p.title.toLowerCase().includes(searchVal.toLowerCase()) ||
            p.skuList.some(s => s.skuTitle.toLowerCase().includes(searchVal.toLowerCase()) || s.skuCode.toLowerCase().includes(searchVal.toLowerCase()))
          );
        }
        // Sotuvda: tugash arafasidagilar (kam zaxira) tepada — o'sish tartibida
        if (activeFilter === 'active') {
          working = working.slice().sort((a, b) => productTotalStock(a) - productTotalStock(b));
        }
        const filtered = working;

        if (filtered.length === 0) {
          listHTML = `
            <div class="p-6 text-center text-slate-500 bg-darkCard border border-darkBorder rounded-2xl flex flex-col items-center gap-2">
              <i data-lucide="inbox" class="w-8 h-8 text-slate-600"></i>
              <span class="text-xs">Bu bo'limda tovar yo'q</span>
            </div>
          `;
        } else {
        listHTML = filtered.map(p => {
          const isBanned = p.status?.value === 'PERM_BANNED';
          const pImage = p.photos?.[0]?.photoKey || 'https://via.placeholder.com/60';

          let skuSection = p.skuList.map(sku => {
            const skuAvail = Math.max(0, sku.availableAmount || 0); // 13.1: manfiy zaxira (RUN_OUT) 0 deb olinadi
            const tInfo = resolveTannarx(sku.skuId, p.productId); // 3.4/3.5: SKU/mahsulot qo'lda yoki turi
            const mappedName = tannarxLabel(tInfo);

            // Analytics
            const sellPrice = sku.purchasePrice;
            const com = resolveCommission(sku.skuId, sku, p.productId); // { pct, source } (3.1/3.4)
            const comPercent = com.pct;
            const commission = sellPrice * (comPercent / 100);

            const costSetting = state.costs[sku.skuId] || { budget: 0 };
            const logi = resolveLogistics(sku.skuId, p.productId, sku); // { val, source, litr } (3.2/3.4/4.1)
            const logistics = logi.val;
            const stor = resolveStorage(sku.skuId, p.productId, sku); // { val, source, litr, days } (4.2)
            const storage = stor.val;
            const dailyBudget = costSetting.budget; // "Reklama byudjeti (kuniga, so'm)"
            // oxirgi 30 kunda shu SKU necha dona sotilgani
            const unitsSold = state.orders.filter(o => o.skuId === sku.skuId).reduce((acc, o) => acc + (o.quantity || 1), 0);
            const adCostPerUnit = unitsSold > 0 ? (dailyBudget * 30) / unitsSold : 0;
            const noSalesWithSpend = dailyBudget > 0 && unitsSold === 0;
            const tannarx = tInfo.tannarx;

            // 4.3: yagona formula — sotuv_narxi − komissiya − logistika − saqlash − reklama/dona − tannarx
            const profit = sellPrice - commission - logistics - storage - adCostPerUnit - tannarx;
            const pmMargin = sellPrice > 0 ? (profit / sellPrice) * 100 : 0;
            const profitColor = profit >= 0 ? "text-brand" : "text-rose-400";

            // 5.1/5.2/5.4: zaxira kunlari, ABC toifa, Xitoy buyurtma nuqtasi (server hisoblagan, snapshot tarixidan)
            const metric = state.skuMetrics?.perSku?.[sku.skuId] || null;
            const stockDaysVal = metric && metric.canCompute ? (metric.stockDays30 != null ? metric.stockDays30 : metric.stockDays7) : null;
            const stockDaysColor = stockDaysVal == null ? 'text-slate-500' : stockDaysVal < 7 ? 'text-rose-400' : stockDaysVal < 14 ? 'text-amber-400' : 'text-brand';
            // C4: sabab aniq — nega hisoblab bo'lmasligi tushunarli bo'lsin
            const stockDaysLabel = stockDaysVal == null ? "sotuv tarixi yo'q" : `${stockDaysVal.toFixed(1)} kunga yetadi`;

            const homeStock = tInfo.tracksStock && tInfo.type ? tInfo.type.stock : null;
            const avgDailyBest = metric ? (metric.avgDaily30 != null ? metric.avgDaily30 : metric.avgDaily7) : null;
            let recommendedQty = null;
            if (homeStock != null && avgDailyBest != null && avgDailyBest > 0) {
              recommendedQty = Math.min(homeStock, Math.max(0, Math.ceil(30 * avgDailyBest - skuAvail)));
            }

            return `
              <div class="mt-2.5 rounded-xl bg-darkBg/90 border border-darkBorder overflow-hidden">
                <!-- C2: yig'ilgan holat (default) — faqat eng muhimi -->
                <div class="p-2.5 cursor-pointer" onclick="this.nextElementSibling.classList.toggle('hidden'); this.querySelector('.sku-chevron').classList.toggle('rotate-180')">

                      <!-- 3.3: SKU rasmi (rang/model bo'yicha). Yuklanmasa placeholder -->
                      ${sku.image ? `<img src="${sku.image}" referrerPolicy="no-referrer" alt="" class="w-9 h-9 rounded-lg object-cover border border-darkBorder bg-darkCard shrink-0" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="w-9 h-9 rounded-lg border border-darkBorder bg-darkCard shrink-0 items-center justify-center text-slate-600" style="display:none"><i data-lucide="image-off" class="w-4 h-4"></i></div>` : `<div class="w-9 h-9 rounded-lg border border-darkBorder bg-darkCard shrink-0 flex items-center justify-center text-slate-600"><i data-lucide="image-off" class="w-4 h-4"></i></div>`}
                      <div class="flex flex-col gap-0.5 min-w-0">
                        <span class="text-[11.5px] font-bold text-brand tracking-tight font-sans truncate">${sku.skuTitle}${rankBadge ? ` <span class="text-[9px]">${rankBadge}</span>` : ''}</span>
                        <span class="text-[10px] text-slate-400">Uzum: ${skuAvail} dona · ${fmtMoney(sellPrice)} so'm · Foyda: <span class="${profitColor} font-semibold">${fmtMoney(profit)} (${fmtPct(pmMargin)}%)</span></span>
                        <span class="text-[10px] ${stockDaysColor}">Zaxira: ${stockDaysLabel}</span>
                      </div>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                      <button onclick="event.stopPropagation(); toggleModal('mapping-modal', '${sku.skuId}')" class="text-[9.5px] text-darkBg bg-brand px-2 py-0.5 rounded font-bold transition hover:bg-brandDark badge-glow whitespace-nowrap">
                        Bog'lash / Sozlash
                      </button>
                      <i data-lucide="chevron-down" class="sku-chevron w-3.5 h-3.5 text-slate-500 transition-transform"></i>
                    </div>
                  </div>
                  ${needsReorder ? `
                    <div class="mt-2 text-[9.5px] bg-slate-900 border border-orange-800 p-1 rounded-md text-center">
                      <span class="text-orange-400">🚚 Xitoyga buyurtma bering — kelguncha tugaydi</span>
                    </div>
                  ` : ''}
                </div>

                <!-- C2: bosganda ochiladigan qism — qolgan hammasi -->
                <div class="hidden px-2.5 pb-2.5 border-t border-darkBorder/40 pt-2">
                  <div class="text-[10px] mb-1.5 font-mono text-slate-500">ID: ${sku.skuId} | Code: ${sku.skuCode}</div>

                    <div class="text-[9px] text-amber-400/80 mb-1">⚠️ Zaxira kuzatilmaydi — faqat foyda hisobida ishlatiladi</div>
                  ` : ''}

                    <div class="flex justify-between">
                      <span class="text-slate-400">Tannarx:</span>
                      <span class="font-semibold text-slate-200">${fmtMoney(tannarx)} so'm</span>
                    </div>

    // 14C: davr nomi — Moliya va D4 bir xil yorliqni ishlatadi
    function financePeriodLabel(fin) {
      const names = { today: 'Bugun', yesterday: 'Kecha', week: '1 hafta', month: '30 kun' };
      const name = names[fin?.period] || 'Davr';
      if (fin?.period === 'today' && fin?.asOf) {
        const t = new Date(new Date(fin.asOf).getTime());
        const hh = String(t.getUTCHours() + 5).padStart(2, '0');
        const mm = String(t.getUTCMinutes()).padStart(2, '0');
        return `${name} (soat ${hh}:${mm} holatiga)`;
      }
      return name;
    }

    // 14C1: Moliya/D4 davr tanlovi — faqat tegishli blok qayta render bo'ladi, butun sahifa emas
    async function setFinancePeriod(period) {
      if (state.financePeriod === period && state.financeSummary) { return; }
      state.financePeriod = period;
      localStorage.setItem('uz_finance_period', period);
      state.financeLoading = true; // 14C3: "Bugun" uchun yangi snapshot olingani sabab biroz uzoqroq turishi mumkin
      if (state.activeTab === 'finance') renderFinance(document.getElementById('main-view'));
      try {
        state.financeSummary = await fetchFromProxy(`/api/period-report/${state.activeShop}?period=${period}`);
      } catch (e) {
        console.error("Moliya xulosasini yuklashda xato:", e);
        state.financeSummary = null;
      }
      state.financeLoading = false;
      if (state.activeTab === 'finance') renderFinance(document.getElementById('main-view'));
      else if (state.activeTab === 'dashboard') renderDashboard(document.getElementById('main-view'));
    }

    // ============ 18-A: MOLIYA MA'LUMOTLARI BOSHQARUVI ============
    // Server manba (Stage 15) — bu ma'lumotlar FAQAT aniq foydalanuvchi harakati bilan yoziladi.
    function finId() { return 'f_' + Date.now() + '_' + Math.floor(Math.random() * 1000); }
    function todayISO() { return new Date(Date.now() + 5 * 3600 * 1000).toISOString().slice(0, 10); }

    // 18-KREDIT-FIX: pul maydonlari <input type="number"> edi — bo'shliq/vergul bilan yozilgan katta
    // summalar ("23 577 979") brauzer tomonidan RAD ETILIB, maydon jimgina bo'sh qolardi (kiritish
    // "ishlamayapti" bo'lib ko'rinardi). Endi type="text" + jonli formatlash: foydalanuvchi bo'shliq
    // bilan yozishi mumkin, orqa fonda toza raqamga aylanadi.
    function onMoneyInput(el) {
      const digits = el.value.replace(/[^\d]/g, '');
      el.value = digits ? Number(digits).toLocaleString('uz-UZ') : '';
    }
    function parseMoneyInput(id) {
      const el = document.getElementById(id);
      if (!el) return 0;
      return parseInt(el.value.replace(/[^\d]/g, '')) || 0;
    }

    // Barcha moliya ma'lumotini serverga yozadi (aniq harakatdan keyin), so'ng shu tab qayta render bo'ladi.
    // confirmClear: shu chaqiriqda ATAYLAB bo'shatilayotgan kalitlar ro'yxati (masalan, oxirgi yozuvni
    // o'chirish) — server buni bo'sh-yozuv himoyasidan o'tkazish uchun ishlatadi (2026-08-02 hodisasidan keyin).
    async function saveFinanceData(confirmClear = []) {
      let resp;
      try {
        resp = await fetch('/api/finance-data', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ withdrawals: state.withdrawals, userExpenses: state.userExpenses, credits: state.credits, goals: state.goals, _confirmClear: confirmClear })
        });
      } catch (e) {
        console.error("Moliya ma'lumotini saqlashda xato:", e);
        alert("Saqlashda xato — internet aloqasini tekshiring");
        return;
      }
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        console.error("Moliya saqlash rad etildi:", err);
        alert(err.error || "Saqlashda xato yuz berdi");
        // Server rad etsa — mahalliy holat serverdan farq qilishi mumkin, haqiqiy holatni qayta yuklaymiz
        // (ustidan yozib yubormaslik uchun — aynan shu turdagi xato tufayli ma'lumot yo'qolgan edi).
        await loadServerSettings();
        renderFinance(document.getElementById('main-view'));
        return;
      }
      // localStorage'ga ham aks ettiramiz (offline zaxira)
      localStorage.setItem('uz_withdrawals', JSON.stringify(state.withdrawals));
      localStorage.setItem('uz_userExpenses', JSON.stringify(state.userExpenses));
      localStorage.setItem('uz_credits', JSON.stringify(state.credits));
      localStorage.setItem('uz_goals', JSON.stringify(state.goals));
      // Cash-flow'ni qayta yuklaymiz (B1 — o'zgargan ma'lumot aks etsin)
      loadCashFlow().then(() => renderFinance(document.getElementById('main-view')));
    }

    // A1: yechib olingan pul
    function addWithdrawal() {
      const date = document.getElementById('wd-date').value || todayISO();
      const amount = parseMoneyInput('wd-amount');
      const note = document.getElementById('wd-note').value.trim();
      if (amount <= 0) return alert("Summani kiriting");
      state.withdrawals.push({ id: finId(), date, amount, note, status: 'kutilmoqda' });
      document.getElementById('wd-amount').value = ''; document.getElementById('wd-note').value = '';
      saveFinanceData();
    }
    function toggleWithdrawalStatus(id) {
      const w = state.withdrawals.find(x => x.id === id);
      if (w) { w.status = w.status === 'keldi' ? 'kutilmoqda' : 'keldi'; saveFinanceData(); }
    }
    function deleteWithdrawal(id) {
      if (!confirm("Bu yozuvni o'chirasizmi?")) return;
      state.withdrawals = state.withdrawals.filter(x => x.id !== id);
      saveFinanceData(state.withdrawals.length === 0 ? ['withdrawals'] : []);
    }

    // A2: real xarajatlar
    function addUserExpense() {
      const date = document.getElementById('ue-date').value || todayISO();
      const amount = parseMoneyInput('ue-amount');
      const category = document.getElementById('ue-category').value;
      const note = document.getElementById('ue-note').value.trim();
      if (amount <= 0) return alert("Summani kiriting");
      state.userExpenses.push({ id: finId(), date, amount, category, note });
      document.getElementById('ue-amount').value = ''; document.getElementById('ue-note').value = '';
      saveFinanceData();
    }
    function deleteUserExpense(id) {
      if (!confirm("Bu xarajatni o'chirasizmi?")) return;
      state.userExpenses = state.userExpenses.filter(x => x.id !== id);
      saveFinanceData(state.userExpenses.length === 0 ? ['userExpenses'] : []);
    }

    // 18-KREDIT-FIX: bugungi (Tashkent) kundan berilgan sanagacha necha kun qolgani (ko'rsatish uchun, faqat frontend).
    function creditDaysUntilDueFront(dateStr) {
      const today = todayISO();
      return Math.round((new Date(dateStr + 'T00:00:00') - new Date(today + 'T00:00:00')) / 86400000);
    }
    // Sanani 1 oyga suradi (backend addOneMonthISO bilan bir xil mantiq — oy oxiri qisqarsa moslashadi).
    function addOneMonthISO(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      let ny = y, nm = m + 1;
      if (nm > 12) { nm = 1; ny++; }
      const lastDay = new Date(ny, nm, 0).getDate();
      const nd = Math.min(d, lastDay);
      return `${ny}-${String(nm).padStart(2, '0')}-${String(nd).padStart(2, '0')}`;
    }

    // A3: kreditlar — 18-KREDIT-FIX: paymentDay (oy kuni) o'rniga nextPaymentDate (aniq sana) + annuity turi
    // + foiz stavkasi/muddat oxiri/qolgan to'lovlar soni (ixtiyoriy, faqat ko'rsatish uchun).
    function addCredit() {
      const name = document.getElementById('cr-name').value.trim();
      const totalAmount = parseMoneyInput('cr-total');
      const remainingAmount = parseMoneyInput('cr-remaining') || totalAmount;
      const monthlyPayment = parseMoneyInput('cr-monthly');
      const nextPaymentDate = document.getElementById('cr-next-date').value;
      const interestRate = parseFloat(document.getElementById('cr-rate').value) || null;
      const endDate = document.getElementById('cr-end-date').value || null;
      const remainingPayments = parseInt(document.getElementById('cr-remaining-count').value) || null;
      const type = document.getElementById('cr-type').value;
      const note = document.getElementById('cr-note').value.trim();
      if (!name || monthlyPayment <= 0) return alert("Kredit nomi va oylik to'lovni kiriting");
      if (!nextPaymentDate) return alert("Keyingi to'lov sanasini kiriting");
      state.credits.push({ id: finId(), name, totalAmount, remainingAmount, monthlyPayment, nextPaymentDate, interestRate, endDate, remainingPayments, type, note });
      ['cr-name','cr-total','cr-remaining','cr-monthly','cr-next-date','cr-rate','cr-end-date','cr-remaining-count','cr-note'].forEach(id => document.getElementById(id).value = '');
      saveFinanceData();
    }
    // "To'ladim": sanaga bog'liq EMAS — istalgan vaqt bosish mumkin (oldindan to'lash holati uchun).
    // Qolgan qarz oylik to'lov miqdoricha kamayadi, keyingi to'lov 1 oyga suriladi, qolgan to'lovlar soni −1.
    function markCreditPaid(id) {
      const c = state.credits.find(x => x.id === id);
      if (!c) return;
      if (!confirm(`"${c.name}" uchun ${fmtMoney(c.monthlyPayment)} so'm to'lovni belgilaysizmi? Qolgan qarz kamayadi, keyingi to'lov sanasi 1 oyga suriladi.`)) return;
      c.remainingAmount = Math.max(0, (c.remainingAmount || 0) - c.monthlyPayment);
      if (c.nextPaymentDate) c.nextPaymentDate = addOneMonthISO(c.nextPaymentDate);
      if (c.remainingPayments != null) c.remainingPayments = Math.max(0, c.remainingPayments - 1);
      saveFinanceData();
    }
    function deleteCredit(id) {
      if (!confirm("Bu kreditni o'chirasizmi?")) return;
      state.credits = state.credits.filter(x => x.id !== id);
      saveFinanceData(state.credits.length === 0 ? ['credits'] : []);
    }

    // C4: maqsad
    function addGoal() {
      const target = parseMoneyInput('goal-target');
      if (target <= 0) return alert("Maqsad summasini kiriting");
      state.goals = [{ id: finId(), type: 'monthly_turnover', target, createdDate: todayISO() }]; // bitta faol maqsad
      saveFinanceData();
    }
    function deleteGoal(id) {
      state.goals = state.goals.filter(x => x.id !== id);
      saveFinanceData(state.goals.length === 0 ? ['goals'] : []);
    }

    // UI Panel: FINANCE & ACCOUNTING
    function renderFinance(root) {

    function renderFinanceUnsafe(root) {
      // B1: Moliya bo'limi endi snapshot delta'ga asoslangan xulosadan (finance/orders doim bo'sh)
      const fin = state.financeSummary;
      const finReady = !!(fin && fin.ok && fin.ready);

      // B3: Nolikvid — rasm + mahsulot nomi + rang + necha kundan beri sotilmagani
      const deadStockItems = [];
      (state.cachedUzumProducts || []).forEach(p => (p.skuList || []).forEach(sku => {
        const m = state.skuMetrics?.perSku?.[sku.skuId];
        if (m && m.isDeadStock) {
          const deadAvail = Math.max(0, sku.availableAmount || 0); // 13.1: manfiy zaxira 0
          const tInfo = resolveTannarx(sku.skuId, p.productId);
          const stor = resolveStorage(sku.skuId, p.productId, sku);
          const tiedCapital = tInfo.tannarx * deadAvail;
          const dailyWaste = (stor.val / stor.days) * deadAvail;
          deadStockItems.push({
            productTitle: p.title, colorTitle: sku.skuTitle, image: sku.image || p.photos?.[0]?.photoKey,
            qty: deadAvail, tiedCapital, dailyWaste, daysSinceLastSale: m.daysSinceLastSale
          });
        }
      }));
      const totalDeadCapital = deadStockItems.reduce((a, i) => a + i.tiedCapital, 0);
      const totalDeadDaily = deadStockItems.reduce((a, i) => a + i.dailyWaste, 0);

      // 2.3: real Uzum xarajatlarini SOURCE bo'yicha guruhlaymiz (type=OUTCOME/INCOME).
      const realExpensesBySource = {};
      let realExpensesTotal = 0, realIncomeTotal = 0;
      state.expenses.forEach(x => {
        const amt = (x.amount != null ? x.amount : (x.paymentPrice || 0)) || 0;
        if (x.type === 'INCOME') { realIncomeTotal += amt; return; }
        const src = x.source || x.name || 'Boshqa';
        realExpensesBySource[src] = (realExpensesBySource[src] || 0) + amt;
        realExpensesTotal += amt;
      });

      const totalProfit = finReady ? fin.totalProfit - realExpensesTotal : 0;
      const profitColor = totalProfit >= 0 ? 'text-brand' : 'text-rose-400';
      const periodLabel = financePeriodLabel(fin);

      // 14C1: davr tanlash pill-tugmalari
      const periodDefs = [
        { key: 'today', label: 'Bugun' },
        { key: 'yesterday', label: 'Kecha' },
        { key: 'week', label: '1 hafta' },
        { key: 'month', label: '30 kun' }
      ];
      const periodButtons = periodDefs.map(p => {
        const selected = p.key === state.financePeriod;
        return `
          <button onclick="setFinancePeriod('${p.key}')" class="shrink-0 text-[11px] font-semibold px-3 py-1.5 rounded-lg border transition ${selected ? 'bg-brand text-darkBg border-brand badge-glow' : 'bg-darkBg text-slate-300 border-darkBorder hover:text-white'}">
            ${p.label}
          </button>
        `;
      }).join('');

      root.innerHTML = `
        <div class="flex flex-col gap-5">

          <!-- 14C1: davr tanlash -->
          <div class="flex gap-2 overflow-x-auto pb-1 -mb-1">
            ${periodButtons}
          </div>

          ${state.dataErrors?.expenses ? dataErrorBanner('Xarajatlar — ' + state.dataErrors.expenses) : ''}

          <!-- Balance Widget — Uzum Seller API'da balans/yechib olish endpointi yo'q, shuning uchun bu yerda soxta raqam ko'rsatilmaydi -->
          <div class="bg-gradient-to-br from-brand/10 to-brand/5 border border-brand/20 rounded-3xl p-5 relative overflow-hidden accent-glow">
            <div class="absolute -right-10 -bottom-10 opacity-5">
              <i data-lucide="gem" class="w-32 h-32 text-brand"></i>
            </div>
            <span class="text-xs text-brand uppercase tracking-wider font-mono">UZUM BANK BALANSI (Shop ID: ${state.activeShop})</span>
            <div class="text-xs text-slate-400 mt-2">⚠️ Bu ma'lumot Uzum API'da mavjud emas (balans endpointi yo'q)</div>
            <div class="text-[10px] text-slate-500 mt-1">Pastdagi "Kutilayotgan Payout" — snapshot tarixi asosida hisoblangan taxmin, Uzum'ning rasmiy balansi emas.</div>
          </div>

          <!-- Sales Profit analysis -->
          <div class="bg-darkCard border border-darkBorder rounded-2xl p-4 flex flex-col gap-3">
            <div class="flex items-center justify-between border-b border-darkBorder pb-2.5">
              <span class="text-xs uppercase font-bold text-slate-300 tracking-wider">Sotuv & Moliya Hisobi</span>
              <span class="text-[10px] text-slate-500 font-mono">${periodLabel}</span>
            </div>

            ${state.financeLoading ? `
              <div class="text-[11px] text-slate-500 text-center py-3">Yuklanmoqda...</div>
            ` : !finReady ? `
              <div class="text-[11px] text-slate-500 text-center py-3">
                Sotuv ma'lumoti olinmadi. ${fin?.error ? `(${fin.error})` : ''}
              </div>
            ` : `
            <div class="flex flex-col gap-2 font-medium">
              <!-- 18-FIX: finance/orders manbasi — real vaqtli va aniq raqamlar. -->
              <div class="flex justify-between text-xs py-1">
                <span class="text-slate-400">Sotildi:</span>
                <span class="text-slate-100 font-mono">${fmtMoney(fin.units)} dona (${fmtMoney(fin.orders)} buyurtma${fin.canceledCount ? `, ${fmtMoney(fin.canceledCount)} bekor` : ''})</span>
              </div>
              <div class="flex justify-between text-xs py-1">
                <span class="text-slate-400">Jami tushum:</span>
                <span class="text-slate-100 font-mono">${fmtMoney(fin.revenue)} so'm</span>
              </div>
              <div class="flex justify-between text-xs py-1">
                <span class="text-slate-400">Komissiya (Uzum):</span>
                <span class="text-slate-100 font-mono">−${fmtMoney(fin.commissionTotal)} so'm</span>
              </div>
              <div class="flex justify-between text-xs py-1">
                <span class="text-slate-400">Logistika (Uzum):</span>
                <span class="text-slate-100 font-mono">−${fmtMoney(fin.logisticsTotal)} so'm</span>
              </div>
              <div class="flex justify-between text-xs py-1">
                <span class="text-slate-400">Uzum to'lovi (payout):</span>
                <span class="text-slate-100 font-mono font-bold">${fmtMoney(fin.payout)} so'm</span>
              </div>
              <div class="flex justify-between text-xs py-1">
                <span class="text-slate-400">Tannarx (xarid):</span>
                <span class="text-slate-100 font-mono">−${fmtMoney(fin.cost)} so'm</span>
              </div>
              <div class="flex justify-between text-xs py-1 border-t border-darkBorder/40 pt-1.5">
                <span class="text-slate-300 font-semibold">Sof foyda (sotuvdan):</span>
                <span class="text-brand font-mono font-bold">${fmtMoney(fin.profit)} so'm${fin.revenue > 0 ? ` (${fmtPct((fin.profit/fin.revenue)*100)}%)` : ''}</span>
              </div>
              ${fin.costSource ? `<div class="text-[9.5px] text-slate-500">🏷️ Tannarx: ${fin.costSource.userSkus||0} ta sizniki${fin.costSource.uzumSkus ? `, <span class="text-amber-400/90">${fin.costSource.uzumSkus} ta Uzum tannarxi</span>` : ''}${fin.costSource.unknownSkus ? `, ${fin.costSource.unknownSkus} ta noma'lum` : ''}</div>` : ''}
              <!-- 2.3: real Uzum xarajatlari source bo'yicha (kategoriya o'ylab topilmaydi) -->
              <div class="border-t border-darkBorder/40 pt-2 mt-1">
                <div class="text-[10px] uppercase text-slate-500 mb-1">Uzum xarajatlari (oxirgi 30 kun):</div>
                ${Object.keys(realExpensesBySource).length === 0
                  ? `<div class="text-[10.5px] text-slate-500">Bu davrda xarajat yozuvi yo'q</div>`
                  : Object.entries(realExpensesBySource).sort((a,b)=>b[1]-a[1]).map(([src,amt])=>`
                    <div class="flex justify-between text-[10.5px] py-0.5">
                      <span class="text-slate-400">${src}</span>
                      <span class="text-slate-300 font-mono">${fmtMoney(amt)} so'm</span>

                ${realIncomeTotal ? `<div class="flex justify-between text-[10.5px] py-0.5 text-emerald-400 border-t border-darkBorder/30 mt-1 pt-1"><span>Kirim (INCOME)</span><span class="font-mono">${fmtMoney(realIncomeTotal)} so'm</span></div>` : ''}
              </div>
              ${fin.period === 'today' ? `
                <div class="flex items-start gap-1.5 text-[10.5px] text-amber-400 bg-amber-950/20 border border-amber-900/40 rounded-lg px-2 py-1.5">
                  <span>⏳</span>
                  <span>Bugun — kun hali tugamagan, yangilanib boradi</span>
                </div>
              ` : ''}
              <div class="flex justify-between text-sm py-2 border-t border-darkBorder/40 mt-1.5">
                <span class="text-slate-300 font-bold uppercase text-[11px] tracking-wider">Sof foyda (real xarajatlardan keyin):</span>
                <span class="font-black font-mono text-xs ${profitColor}">${fmtMoney(totalProfit)} so'm</span>
              </div>
              <div class="text-[9.5px] text-slate-500">📊 Manba: Uzum buyurtmalar (real vaqtli). Saqlash/reklama — alohida xarajat sifatida yuqoridagi ro'yxatda.</div>
            </div>
            `}
          </div>

          <!-- B3: Nolikvid widget -->
          <div class="bg-darkCard border border-darkBorder rounded-2xl p-4">
            <div class="flex items-center justify-between mb-1 border-b border-darkBorder pb-2.5">
              <span class="text-xs uppercase font-bold text-slate-300 tracking-wider">❄️ Nolikvid</span>
              <span class="text-[10px] font-mono font-bold text-amber-400">${deadStockItems.length} ta SKU</span>
            </div>
            <div class="text-[10px] text-slate-500 mb-2.5 mt-1.5">Sotilmayotgan tovar — puli qotgan, saqlash xarajati ketyapti</div>
            ${!state.skuMetrics?.ready30 ? `
              <div class="text-[11px] text-slate-500 text-center py-2">Hisoblab bo'lmaydi — snapshot tarixi hali 30 kunlik emas</div>
            ` : deadStockItems.length === 0 ? `
              <div class="text-[11px] text-slate-500 text-center py-2">Nolikvid tovar topilmadi — hammasi oxirgi 30 kunda sotilgan</div>
            ` : `
              <div class="flex flex-col gap-2 max-h-[220px] overflow-y-auto mb-2.5">
                ${deadStockItems.map(i => `
                  <div class="p-2 py-1.5 rounded-lg bg-darkBg border border-darkBorder flex items-center gap-2 text-[11px]">
                    ${i.image ? `<img src="${i.image}" referrerPolicy="no-referrer" class="w-8 h-8 rounded-lg object-cover border border-darkBorder shrink-0" onerror="this.style.display='none'">` : `<div class="w-8 h-8 rounded-lg bg-darkCard border border-darkBorder shrink-0"></div>`}
                    <div class="flex flex-col min-w-0 flex-1">
                      <span class="font-semibold text-slate-300 truncate">${i.productTitle} — ${i.colorTitle}</span>
                      <span class="text-[9.5px] text-slate-500">${i.qty} dona · ${fmtMoney(i.tiedCapital)} so'm qotgan${i.daysSinceLastSale != null ? ` · ${i.daysSinceLastSale} kundan beri sotilmagan` : ''}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
              <div class="flex justify-between text-[11px] pt-2 border-t border-darkBorder/40">
                <span class="text-slate-400">Jami muzlagan kapital:</span>
                <span class="font-bold text-amber-400 font-mono">${fmtMoney(totalDeadCapital)} so'm</span>
              </div>
              <div class="flex justify-between text-[11px] mt-1">
                <span class="text-slate-400">Kuniga saqlashga:</span>
                <span class="font-bold text-rose-400 font-mono">${fmtMoney(totalDeadDaily)} so'm</span>
              </div>
            `}

          <!-- 18-A/B: Moliya boshqaruvi (yechilgan pul, xarajatlar, kreditlar, maqsad, naqd oqim) -->
          ${financeManagementHTML()}

          <!-- 19-C: Kompensatsiya nomzodlari (yo'qolgan/rad etilgan tovar) -->
          ${compensationHTML()}

          <!-- 19-D: Ta'minlashlar (yuk xatlari ro'yxati) -->
          ${invoicesHTML()}

        </div>
      `;
      lucide.createIcons();
    }

    function invoicesHTML() {
      const inv = state.invoices;
      if (!inv || !inv.ok || !inv.count) return '';
      const statusBadge = (s) => s === 'CREATED'
        ? `<span class="text-[9px] px-1.5 py-0.5 rounded bg-sky-900/40 border border-sky-800 text-sky-300">🚚 Yo'lda</span>`
        : `<span class="text-[9px] px-1.5 py-0.5 rounded bg-emerald-900/40 border border-emerald-800 text-emerald-300">✅ Qabul qilingan</span>`;
      // Bekor qilingan (CANCELED) yuk xatlari ro'yxatdan chiqariladi (harakat talab qilmaydi) — faqat sarlavhada son ko'rsatiladi.
      const shown = inv.invoices.filter(iv => iv.status !== 'CANCELED');
      return `
        <div class="bg-darkCard border border-darkBorder rounded-2xl overflow-hidden mb-3">
          <div class="p-3.5 cursor-pointer flex items-center justify-between" onclick="this.parentElement.querySelector('.fin-body').classList.toggle('hidden'); this.querySelector('.fin-chev').classList.toggle('rotate-180')">
            <div class="flex flex-col">
              <span class="text-xs font-bold text-slate-200">📦 Ta'minlashlar (yuk xatlari)</span>
              <span class="text-[10px] text-slate-500">🚚 yo'lda ${fmtMoney(inv.createdCount)} (${fmtMoney(inv.inTransitUnits)} dona) · ✅ qabul ${fmtMoney(inv.acceptedCount)}${inv.canceledCount ? ` · ❌ bekor ${fmtMoney(inv.canceledCount)}` : ''}</span>
            </div>
            <i data-lucide="chevron-down" class="fin-chev w-4 h-4 text-slate-500 transition-transform"></i>
          </div>
          <div class="fin-body hidden px-3.5 pb-3.5 border-t border-darkBorder/40 pt-3">
            <div class="flex flex-col gap-2 max-h-[360px] overflow-y-auto">
              ${shown.map(iv => {
                const diff = iv.totalToStock - iv.totalAccepted;
                return `
                <div class="p-2.5 rounded-lg bg-darkBg border border-darkBorder text-[11px] flex flex-col gap-1">
                  <div class="flex items-center justify-between gap-2">
                    <span class="font-bold text-slate-200">#${iv.invoiceNumber}</span>
                    ${statusBadge(iv.status)}

                  <div class="flex justify-between text-[9.5px] text-slate-500">

                    <span class="font-mono">${fmtMoney(iv.totalToStock)}${iv.status === 'ACCEPTED' ? '→' + fmtMoney(iv.totalAccepted) : ''} dona${iv.status === 'ACCEPTED' && diff > 0 ? ` <span class="text-amber-400">(−${diff})</span>` : ''}</span>
                  </div>
                  <details class="mt-0.5">
                    <summary class="text-[9.5px] text-slate-500 cursor-pointer">Tarkibi (${iv.items.length} SKU)</summary>
                    <div class="flex flex-col gap-0.5 mt-1 border-t border-darkBorder/40 pt-1">
                      ${iv.items.map(it => `<div class="flex justify-between text-[9.5px] text-slate-400"><span class="truncate">${it.skuTitle}</span><span class="font-mono shrink-0 ml-2">${it.toStock}${iv.status === 'ACCEPTED' ? '→' + it.accepted : ''}</span></div>`).join('')}
                    </div>
                  </details>
                </div>`;
              }).join('')}
            </div>
            <div class="text-[9.5px] text-slate-500 mt-2">📊 Manba: Uzum yuk xatlari. "Yo'lda" = uy zaxirasidan ayirilib, Uzum omboriga jo'natilgan.</div>
          </div>
        </div>`;
    }

      return `
        <div class="bg-gradient-to-br from-amber-500/10 to-amber-500/5 border border-amber-500/25 rounded-2xl p-4 mb-3">
          <div class="flex items-center justify-between border-b border-amber-500/20 pb-2.5 mb-2">
            <span class="text-xs uppercase font-bold text-amber-300 tracking-wider">⚠️ Kompensatsiya nomzodlari</span>
            <span class="text-[10px] font-mono font-bold text-amber-400">${fmtMoney(aniq.units)} dona</span>

          </div>
          <div class="flex flex-col max-h-[260px] overflow-y-auto">

              <div class="flex justify-between text-[11px] mb-1">
                <span class="text-slate-400 font-semibold">➕ Qisman aniqlanmagan:</span>
                <span class="text-slate-400 font-mono">${fmtMoney(qisman.units)} dona · ${fmtMoney(qisman.value)} so'm</span>

      const exByCat = {};
      exThisMonth.forEach(e => { exByCat[e.category || 'Boshqa'] = (exByCat[e.category || 'Boshqa'] || 0) + (e.amount || 0); });
      const exTotal = exThisMonth.reduce((a, e) => a + (e.amount || 0), 0);
      // A3 jamlanma
      const creditMonthly = state.credits.reduce((a, c) => a + (c.monthlyPayment || 0), 0);
      const creditRemaining = state.credits.reduce((a, c) => a + (c.remainingAmount || 0), 0);
      const cats = ['Xitoy tovar', 'Logistika', 'Reklama', 'Ijara', 'Ish haqi', 'Soliq', 'Boshqa'];
      const goal = state.goals[0];

      return `
        <div class="border-t-2 border-brand/30 pt-4 mt-2">
          <div class="text-sm font-black text-brand uppercase tracking-wider mb-3 flex items-center gap-2">

          </div>

      // Add User's bubble
      box.innerHTML += `
        <div class="p-2 px-3 rounded-2xl bg-brand/10 border border-brand/35 text-[11px] text-brand self-end max-w-[85%] font-mono my-1">
          ${command}
        </div>
      `;

      // Sim response delay
      setTimeout(() => {
        let reply = "";
        if (command === '/start') {
          reply = `🟣 *Uzum Pro Dashboard* \n\nAssalomu alaykum! Sokin kiritshingiz muvaffaqiyatli sodir bo'ldi. Men sizning Uzum sotuvchi yordamchingizmi.\n\nFoydalanish uchun buyruqlar:\n/hisobot — Kunlik savdo va moliya hisoboti\n/dashboard — Mini App darchasiga kirish`;
        } else if (command === '/hisobot') {
          reply = buildReportText();
        }

        // Output Bot Bubble
        box.innerHTML += `
          <div class="flex items-start gap-2 max-w-[85%] self-start my-1.5">
            <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center font-bold text-[10px] text-slate-100 shrink-0">BOT</div>
            <div class="p-2 px-3 rounded-2xl bg-darkCard border border-darkBorder text-[11px] text-slate-300 leading-normal whitespace-pre-line font-medium shadow">
              ${reply}
            </div>
          </div>
        `;
        box.scrollTop = box.scrollHeight;
      }, 500);
    }

    // 18-C: AI moliyaviy murabbiy — server to'liq kontekstni o'zi yig'adi (faqat shopId yuboramiz)
    async function askGeminiAdvice() {
      const btn = document.getElementById('gemini-trigger-btn');
      btn.disabled = true;
      btn.innerHTML = `<i class="w-4 h-4 animate-spin inline-block mr-1"></i> Murabbiy tahlil qilmoqda...`;
      try {
        const response = await fetch('/api/gemini/advice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ shopId: state.activeShop })
        });
        if (!response.ok) {
          const errRes = await response.json().catch(() => ({}));
          throw new Error(errRes.error || "AI murabbiy xatosi");
        }
        state.aiResults = await response.json();
        renderAiCoach();
      } catch (err) {
        alert(err.message || "Xatolik yuz berdi. Qayta urinib ko'ring.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="brain-circuit" class="w-4 h-4"></i> AI Moliyaviy Murabbiy — tahlil qil`;
        lucide.createIcons();
      }
    }

    // Secret configurations saving
    function saveBotToken() {
      const field = document.getElementById('tg-token-field');
      const val = field.value.trim();
      localStorage.setItem('tg_bot_token', val);
      alert("Telegram Bot API Token saqlandi. Bog'lov yangilandi.");
    }

    // On Load Boostrapper
    window.addEventListener('DOMContentLoaded', async () => {
      // B: avval serverdagi sozlamalarni o'qib birlashtiramiz (bo'sh localStorage saqlangan ma'lumotni o'chirmasin)
      await loadServerSettings();
      refreshData();
    });
  </script>
</body>
</html>
