<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Uzum Pro Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a0f;
    --card: #0d1520;
    --border: rgba(255,255,255,0.08);
    --green: #00ffa3;
    --green2: #00d4aa;
    --blue: #38bdf8;
    --red: #f87171;
    --yellow: #fbbf24;
    --text: #e2eaf2;
    --muted: #4a6070;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); min-height: 100vh; overflow-x: hidden; }
  
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes glow { 0%,100%{box-shadow:0 0 20px rgba(0,255,163,.1)} 50%{box-shadow:0 0 40px rgba(0,255,163,.25)} }

  .fade { animation: fadeUp .4s ease forwards; }

  /* HEADER */
  .header { padding: 16px; background: linear-gradient(180deg, rgba(0,255,163,.05) 0%, transparent 100%); border-bottom: 1px solid var(--border); }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .logo { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; }
  .logo span { color: var(--green); }
  .status-badge { display: flex; align-items: center; gap: 6px; background: rgba(0,255,163,.08); border: 1px solid rgba(0,255,163,.2); border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 600; color: var(--green); animation: glow 3s infinite; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  
  /* SHOPS */
  .shops { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .shops::-webkit-scrollbar { display: none; }
  .shop-btn { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: transparent; color: var(--muted); white-space: nowrap; font-family: inherit; transition: all .2s; }
  .shop-btn.active { border-color: var(--green); background: rgba(0,255,163,.1); color: var(--green); }

  /* TABS */
  .tabs { display: flex; gap: 4px; padding: 10px 16px 0; }
  .tab { flex: 1; padding: 9px 4px; background: transparent; border: none; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; border-radius: 10px; transition: all .2s; font-family: inherit; letter-spacing: .3px; }
  .tab.active { background: rgba(0,255,163,.08); color: var(--green); }

  /* CONTENT */
  .content { padding: 12px 16px 90px; overflow-y: auto; }

  /* CARDS */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; text-align: center; }
  .stat-icon { font-size: 22px; margin-bottom: 4px; }
  .stat-val { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; margin-bottom: 2px; }
  .stat-label { font-size: 10px; color: var(--muted); font-weight: 500; }

  /* PRODUCT CARD */
  .product-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 10px; transition: border-color .2s; }
  .product-card:active { border-color: var(--green); }
  .product-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .product-name { font-weight: 700; font-size: 13px; line-height: 1.3; flex: 1; margin-right: 8px; }
  .product-sku { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: .3px; }
  .badge-ok { background: rgba(0,255,163,.15); color: var(--green); }
  .badge-low { background: rgba(251,191,36,.15); color: var(--yellow); }
  .badge-critical { background: rgba(248,113,113,.15); color: var(--red); }
  .badge-out { background: rgba(100,100,100,.2); color: #888; }
  .product-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .product-stat { background: rgba(0,0,0,.3); border-radius: 8px; padding: 7px 8px; }
  .product-stat-val { font-size: 12px; font-weight: 700; }
  .product-stat-label { font-size: 9px; color: var(--muted); margin-top: 1px; }
  .progress-bar { background: rgba(255,255,255,.06); border-radius: 4px; height: 5px; overflow: hidden; margin-bottom: 8px; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width .8s ease; }

  /* COST EDITOR */
  .cost-editor { background: rgba(0,255,163,.04); border: 1px solid rgba(0,255,163,.15); border-radius: 12px; padding: 12px; margin-top: 8px; }
  .cost-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; }
  .cost-label { color: var(--muted); }
  .cost-val { font-weight: 600; }
  .profit-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; border-top: 1px solid var(--border); padding-top: 6px; margin-top: 4px; }

  /* WARNING */
  .warning { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.2); border-radius: 10px; padding: 8px 12px; font-size: 11px; color: var(--red); margin-top: 6px; }
  .info-box { background: rgba(56,189,248,.06); border: 1px solid rgba(56,189,248,.2); border-radius: 10px; padding: 8px 12px; font-size: 11px; color: var(--blue); margin-top: 6px; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: flex-end; z-index: 200; }
  .modal { background: #0d1520; border-radius: 20px 20px 0 0; padding: 20px; width: 100%; max-width: 430px; margin: 0 auto; border: 1px solid var(--border); border-bottom: none; max-height: 90vh; overflow-y: auto; }
  .modal-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 16px; margin-bottom: 4px; }
  .modal-sub { font-size: 11px; color: var(--muted); margin-bottom: 16px; }
  .input-group { margin-bottom: 12px; }
  .input-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .inp { background: rgba(255,255,255,.04); border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 13px; width: 100%; outline: none; font-family: inherit; transition: border .2s; }
  .inp:focus { border-color: var(--green); }
  .profit-preview { background: rgba(0,0,0,.4); border-radius: 12px; padding: 12px; margin: 12px 0; }
  .btn-save { background: linear-gradient(135deg, var(--green), var(--green2)); border: none; border-radius: 12px; padding: 13px; color: #050a0f; font-weight: 800; font-size: 14px; cursor: pointer; width: 100%; font-family: inherit; }

  /* AI CHAT */
  .chat-container { display: flex; flex-direction: column; gap: 10px; }
  .quick-btns { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
  .quick-btns::-webkit-scrollbar { display: none; }
  .quick-btn { background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 16px; padding: 7px 12px; color: var(--muted); font-size: 11px; font-weight: 500; cursor: pointer; white-space: nowrap; font-family: inherit; transition: all .2s; }
  .quick-btn:hover { background: rgba(0,255,163,.08); color: var(--green); border-color: rgba(0,255,163,.25); }
  .msg { display: flex; justify-content: flex-end; }
  .msg.bot { justify-content: flex-start; gap: 8px; }
  .msg-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--green), var(--green2)); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; align-self: flex-end; }
  .msg-bubble { max-width: 82%; padding: 11px 14px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; border-radius: 18px 18px 4px 18px; background: linear-gradient(135deg, var(--green), var(--green2)); color: #050a0f; font-weight: 500; }
  .msg.bot .msg-bubble { border-radius: 18px 18px 18px 4px; background: var(--card); color: var(--text); border: 1px solid var(--border); font-weight: 400; }
  .typing { display: flex; gap: 5px; align-items: center; padding: 12px 16px; }
  .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.4s infinite; }

  /* NOTIFICATIONS */
  .notif { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; }
  .notif-danger { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.2); }
  .notif-warning { background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.2); }
  .notif-info { background: rgba(56,189,248,.08); border: 1px solid rgba(56,189,248,.2); }
  .notif-dot-el { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .notif-text { font-size: 12px; line-height: 1.5; }

  /* CHAT INPUT */
  .chat-input-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 430px; margin: 0 auto; padding: 10px 16px 20px; background: linear-gradient(0deg, var(--bg) 70%, transparent); display: flex; gap: 8px; }
  .chat-inp { background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 11px 14px; color: var(--text); font-size: 13px; flex: 1; outline: none; font-family: inherit; transition: border .2s; }
  .chat-inp:focus { border-color: var(--green); }
  .send-btn { background: linear-gradient(135deg, var(--green), var(--green2)); border: none; border-radius: 12px; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .send-btn:disabled { opacity: .4; cursor: default; }
  
  .loading-spinner { width: 18px; height: 18px; border: 2px solid rgba(5,10,15,.3); border-top-color: #050a0f; border-radius: 50%; animation: spin 1s linear infinite; }

  .section-title { font-size: 10px; color: var(--muted); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
  .empty { text-align: center; padding: 30px 0; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<div id="app" style="max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;">

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div class="logo">Uzum <span>Pro</span> 🚀</div>
      <div class="status-badge" id="statusBadge">
        <div class="status-dot"></div>
        <span id="statusText">Tekshirilmoqda...</span>
      </div>
    </div>
    <div class="shops" id="shopsList">
      <button class="shop-btn active" onclick="selectShop('all')">🏪 Hammasi</button>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('dashboard')">📊 Bosh</button>
    <button class="tab" onclick="switchTab('products')">📦 Tovarlar</button>
    <button class="tab" onclick="switchTab('ai')">🤖 AI</button>
    <button class="tab" onclick="switchTab('notifs')">🔔 <span id="notifCount"></span>Ogoh.</button>
  </div>

  <!-- CONTENT -->
  <div class="content" id="content"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" style="display:none;" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Xarajatlar</div>
    <div class="modal-sub" id="modalSub">Haqiqiy ma'lumotlarni kiriting</div>
    <div class="input-group">
      <div class="input-label">Haqiqiy tannarx (so'm/dona)</div>
      <input class="inp" type="number" id="inpCost" placeholder="Xitoydan kelgan narx" oninput="updatePreview()">
    </div>
    <div class="input-group">
      <div class="input-label">Uzum saqlash xarajati (so'm/oy)</div>
      <input class="inp" type="number" id="inpStorage" placeholder="Ombor to'lovi" oninput="updatePreview()">
    </div>
    <div class="input-group">
      <div class="input-label">Reklama xarajati (so'm/kun)</div>
      <input class="inp" type="number" id="inpAds" placeholder="BOOST va boshqalar" oninput="updatePreview()">
    </div>
    <div class="input-group">
      <div class="input-label">Uy zaxirasi (dona)</div>
      <input class="inp" type="number" id="inpHomeStock" placeholder="Uyda nechta bor">
    </div>
    <div class="input-group">
      <div class="input-label">Kunlik o'rtacha sotuv (dona)</div>
      <input class="inp" type="number" id="inpDailySales" placeholder="Taxminan kuniga nechta" oninput="updatePreview()">
    </div>
    <div class="profit-preview" id="profitPreview"></div>
    <button class="btn-save" onclick="saveCosts()">✅ Saqlash</button>
  </div>
</div>

<!-- AI CHAT INPUT -->
<div class="chat-input-bar" id="chatInputBar" style="display:none;">
  <input class="chat-inp" id="chatInput" placeholder="Savolingizni yozing..." onkeydown="if(event.key==='Enter')sendAI()">
  <button class="send-btn" id="sendBtn" onclick="sendAI()">↑</button>
</div>

<script>
const SERVER = 'https://uzum-pro-server-production.up.railway.app';
const COMMISSION = { 'Одежда':25,'Электроника':17,'Бытовая техника':10,'Аксессуары':25,'Обувь':25,'Красота':20,'Спорт':20,'Детские товары':15,'Дом':20,'Авто':18 };
const LOGISTICS = { 'МГТ':5000,'СГТ':8000,'КГТ':20000 };

let products = [];
let shops = [];
let selectedShop = 'all';
let currentTab = 'dashboard';
let costs = JSON.parse(localStorage.getItem('uzum_costs') || '{}');
let editingProduct = null;
let aiMessages = [{ role:'bot', text:'Salom! 🤖 Men sizning AI maslahatchiingizman.\n\nTovarlaringiz haqida savolingizni yozing!' }];
let aiLoading = false;

function fmt(n) { return Math.round(n||0).toLocaleString('uz-UZ'); }

function getCommission(cat) {
  for(const [k,v] of Object.entries(COMMISSION)) {
    if(cat && cat.toLowerCase().includes(k.toLowerCase())) return v;
  }
  return 20;
}

function getLogistics(gab) { return LOGISTICS[gab] || 5000; }

function calcProfit(p) {
  const c = costs[p.id] || {};
  const price = p.price || 0;
  const commission = price * getCommission(p.category) / 100;
  const logistics = getLogistics(p.gab);
  const storage = Number(c.storage || 0);
  const ads = Number(c.ads || 0);
  const realCost = Number(c.realCost || 0);
  const profit = price - commission - logistics - storage - ads - realCost;
  const margin = price > 0 ? (profit/price*100).toFixed(1) : 0;
  const stock = p.stock || 0;
  const dailySales = Number(c.dailySales || 0);
  const daysLeft = stock > 0 && dailySales > 0 ? Math.floor(stock/dailySales) : null;
  const needOrder = daysLeft !== null && daysLeft < 28;
  return { price, commission, logistics, storage, ads, realCost, profit, margin, daysLeft, needOrder };
}

function getStatus(p) {
  const s = p.stock || 0;
  const c = costs[p.id] || {};
  const d = Number(c.dailySales || 0);
  if(s === 0) return 'out';
  if(d > 0) {
    const days = s/d;
    if(days < 3) return 'critical';
    if(days < 28) return 'low';
  }
  return 'ok';
}

function badgeHTML(status) {
  const map = { ok:['badge-ok','✅ Yetarli'], low:['badge-low','⚠️ Kam'], critical:['badge-critical','🔴 Kritik!'], out:['badge-out','❌ Tugagan'] };
  const [cls, label] = map[status] || map.ok;
  return `<span class="badge ${cls}">${label}</span>`;
}

// FETCH DATA
async function fetchData() {
  try {
    const r = await fetch(`${SERVER}/api/products?shopId=61122&size=100&page=0`);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    
    const list = data.productList || data.data || data || [];
    products = list.map(p => ({
      id: p.productId || p.id,
      name: p.title || p.name || 'Nomsiz',
      sku: p.skuList?.[0]?.skuFullTitle || p.sku || '-',
      price: p.skuList?.[0]?.purchasePrice || p.price || 0,
      stock: p.skuList?.[0]?.quantityActive || p.stock || 0,
      category: p.category?.title || p.category || 'Boshqa',
      gab: p.skuList?.[0]?.gab || 'МГТ',
      commission: p.commissionDto?.currentCommission || null
    }));

    document.getElementById('statusBadge').style.background = 'rgba(0,255,163,.08)';
    document.getElementById('statusBadge').style.borderColor = 'rgba(0,255,163,.2)';
    document.getElementById('statusText').textContent = `✅ ${products.length} tovar`;
    
    updateShops();
    renderCurrentTab();
  } catch(e) {
    document.getElementById('statusBadge').style.background = 'rgba(248,113,113,.1)';
    document.getElementById('statusBadge').style.borderColor = 'rgba(248,113,113,.2)';
    document.getElementById('statusBadge').style.color = '#f87171';
    document.getElementById('statusText').textContent = '❌ Xato: '+e.message;
    renderCurrentTab();
  }
}

function updateShops() {
  const container = document.getElementById('shopsList');
  container.innerHTML = `<button class="shop-btn ${selectedShop==='all'?'active':''}" onclick="selectShop('all')">🏪 Hammasi</button>`;
}

function selectShop(id) {
  selectedShop = id;
  document.querySelectorAll('.shop-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderCurrentTab();
}

function getFiltered() {
  return selectedShop === 'all' ? products : products.filter(p => p.shopId == selectedShop);
}

// TAB SWITCHING
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('chatInputBar').style.display = tab === 'ai' ? 'flex' : 'none';
  renderCurrentTab();
}

function renderCurrentTab() {
  const tabs = { dashboard: renderDashboard, products: renderProducts, ai: renderAI, notifs: renderNotifs };
  (tabs[currentTab] || renderDashboard)();
}

// DASHBOARD
function renderDashboard() {
  const fp = getFiltered();
  const problems = fp.filter(p => getStatus(p) !== 'ok').length;
  const needOrder = fp.filter(p => calcProfit(p).needOrder);
  const totalProfit = fp.reduce((s,p) => {
    const c = costs[p.id] || {};
    const d = Number(c.dailySales || 0);
    return s + calcProfit(p).profit * d * 30;
  }, 0);

  document.getElementById('content').innerHTML = `
    <div class="fade">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">📦</div>
          <div class="stat-val" style="color:var(--blue)">${fp.length}</div>
          <div class="stat-label">Jami tovarlar</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">${problems>0?'⚠️':'✅'}</div>
          <div class="stat-val" style="color:${problems>0?'var(--red)':'var(--green)'}">${problems}</div>
          <div class="stat-label">Muammoli</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">💰</div>
          <div class="stat-val" style="color:var(--green);font-size:13px">${fmt(totalProfit/1000000)}M</div>
          <div class="stat-label">Oylik foyda (taxmin)</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🚢</div>
          <div class="stat-val" style="color:var(--yellow)">${needOrder.length}</div>
          <div class="stat-label">Buyurtma kerak</div>
        </div>
      </div>

      ${needOrder.length > 0 ? `
      <div class="card" style="border-color:rgba(56,189,248,.2);background:rgba(56,189,248,.04)">
        <div class="section-title" style="color:var(--blue)">🚢 Xitoydan buyurtma qiling (28 kun)</div>
        ${needOrder.map(p => {
          const { daysLeft } = calcProfit(p);
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
            <span style="font-size:12px;font-weight:600">${p.name.substring(0,30)}...</span>
            <span style="font-size:11px;color:var(--yellow)">${daysLeft} kun qoldi</span>
          </div>`;
        }).join('')}
      </div>` : ''}

      ${problems > 0 ? `
      <div class="card" style="border-color:rgba(248,113,113,.2)">
        <div class="section-title" style="color:var(--red)">🚨 Hozir diqqat kerak</div>
        ${fp.filter(p=>getStatus(p)!=='ok').map(p => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="switchTab('products')">
            <div>
              <div style="font-size:12px;font-weight:600">${p.name.substring(0,25)}...</div>
              <div style="font-size:10px;color:var(--muted)">${p.stock} dona qoldi</div>
            </div>
            ${badgeHTML(getStatus(p))}
          </div>
        `).join('')}
      </div>` : `
      <div class="card" style="text-align:center;padding:24px">
        <div style="font-size:36px">🎉</div>
        <div style="font-size:14px;font-weight:700;color:var(--green);margin-top:8px">Hamma yaxshi!</div>
        <div style="font-size:12px;color:var(--muted)">Hozircha muammo yo'q</div>
      </div>`}

      <div class="card" style="cursor:pointer;background:linear-gradient(135deg,rgba(0,255,163,.06),rgba(0,212,170,.04));border-color:rgba(0,255,163,.2)" onclick="switchTab('ai');document.querySelectorAll('.tab')[2].classList.add('active');document.querySelectorAll('.tab').forEach((t,i)=>{if(i!==2)t.classList.remove('active')})">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="font-size:32px">🤖</div>
          <div style="flex:1">
            <div style="font-family:'Syne',sans-serif;font-weight:800;color:var(--green)">AI Maslahatchi</div>
            <div style="font-size:11px;color:var(--muted)">Bugun nima qilish kerak? Savol bering!</div>
          </div>
          <div style="color:var(--green);font-size:20px">→</div>
        </div>
      </div>
    </div>`;
}

// PRODUCTS
function renderProducts() {
  const fp = getFiltered();
  const search = '';
  document.getElementById('content').innerHTML = `
    <div class="fade">
      <input class="inp" placeholder="🔍 Tovar nomi yoki SKU..." oninput="filterProducts(this.value)" style="margin-bottom:12px">
      <div id="productsList">${renderProductsList(fp)}</div>
    </div>`;
}

function filterProducts(q) {
  const fp = getFiltered().filter(p => !q || p.name.toLowerCase().includes(q.toLowerCase()) || p.sku.toLowerCase().includes(q.toLowerCase()));
  document.getElementById('productsList').innerHTML = renderProductsList(fp);
}

function renderProductsList(list) {
  if(!list.length) return '<div class="empty">Tovarlar topilmadi</div>';
  return list.map(p => {
    const status = getStatus(p);
    const c = costs[p.id] || {};
    const calc = calcProfit(p);
    const stock = p.stock || 0;
    const pct = Math.min(100, stock > 0 ? (stock / (Number(c.dailySales||1) * 14)) * 100 : 0);
    const barColor = pct < 20 ? 'var(--red)' : pct < 50 ? 'var(--yellow)' : 'var(--green)';

    return `<div class="product-card">
      <div class="product-header">
        <div>
          <div class="product-name">${p.name}</div>
          <div class="product-sku">${p.sku}</div>
        </div>
        ${badgeHTML(status)}
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${barColor}"></div></div>
      <div class="product-stats">
        <div class="product-stat">
          <div class="product-stat-val" style="color:${stock<10?'var(--red)':'var(--text)'}">${fmt(stock)} dona</div>
          <div class="product-stat-label">Zaxira</div>
        </div>
        <div class="product-stat">
          <div class="product-stat-val">${fmt(p.price)} so'm</div>
          <div class="product-stat-label">Narx</div>
        </div>
        <div class="product-stat">
          <div class="product-stat-val" style="color:${calc.daysLeft!==null&&calc.daysLeft<28?'var(--yellow)':'var(--text)'}">${calc.daysLeft !== null ? calc.daysLeft+' kun' : '?'}</div>
          <div class="product-stat-label">Qoldi</div>
        </div>
      </div>
      ${c.realCost ? `
      <div class="cost-editor">
        <div class="section-title">💰 Foyda hisob-kitobi</div>
        <div class="cost-row"><span class="cost-label">Sotuv narxi</span><span class="cost-val">${fmt(calc.price)} so'm</span></div>
        <div class="cost-row"><span class="cost-label">Komissiya (${getCommission(p.category)}%)</span><span class="cost-val" style="color:var(--red)">-${fmt(calc.commission)} so'm</span></div>
        <div class="cost-row"><span class="cost-label">Logistika</span><span class="cost-val" style="color:var(--red)">-${fmt(calc.logistics)} so'm</span></div>
        ${calc.storage ? `<div class="cost-row"><span class="cost-label">Saqlash</span><span class="cost-val" style="color:var(--red)">-${fmt(calc.storage)} so'm</span></div>` : ''}
        ${calc.ads ? `<div class="cost-row"><span class="cost-label">Reklama</span><span class="cost-val" style="color:var(--red)">-${fmt(calc.ads)} so'm</span></div>` : ''}
        <div class="cost-row"><span class="cost-label">Tannarx</span><span class="cost-val" style="color:var(--red)">-${fmt(calc.realCost)} so'm</span></div>
        <div class="profit-row">
          <span>Sof foyda/dona</span>
          <span style="color:${calc.profit>0?'var(--green)':'var(--red)'}">${fmt(calc.profit)} so'm (${calc.margin}%)</span>
        </div>
      </div>
      ${calc.needOrder ? `<div class="info-box">🚢 ${calc.daysLeft} kunda tugaydi — Xitoydan HOZIR buyurtma qiling!</div>` : ''}
      ${calc.profit < 0 ? `<div class="warning">💸 Bu tovardan zarar ko'ryapsiz! Narxni ko'taring yoki xarajatlarni kamaytiring.</div>` : ''}
      ` : `<div style="background:rgba(0,255,163,.04);border:1px dashed rgba(0,255,163,.3);border-radius:10px;padding:10px;text-align:center;cursor:pointer;margin-top:8px" onclick="openModal(${JSON.stringify(p).replace(/"/g,'&quot;')})">
        <div style="font-size:12px;color:var(--green)">+ Tannarx va xarajatlarni kiriting</div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px">Foyda hisoblash uchun</div>
      </div>`}
      <button onclick="openModal(${JSON.stringify(p).replace(/"/g,'&quot;')})" style="width:100%;margin-top:8px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:8px;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit">✏️ Xarajatlarni tahrirlash</button>
    </div>`;
  }).join('');
}

// MODAL
function openModal(p) {
  editingProduct = typeof p === 'string' ? JSON.parse(p) : p;
  const c = costs[editingProduct.id] || {};
  document.getElementById('modalTitle').textContent = editingProduct.name.substring(0,30);
  document.getElementById('modalSub').textContent = `SKU: ${editingProduct.sku} | Narx: ${fmt(editingProduct.price)} so'm`;
  document.getElementById('inpCost').value = c.realCost || '';
  document.getElementById('inpStorage').value = c.storage || '';
  document.getElementById('inpAds').value = c.ads || '';
  document.getElementById('inpHomeStock').value = c.homeStock || '';
  document.getElementById('inpDailySales').value = c.dailySales || '';
  updatePreview();
  document.getElementById('modal').style.display = 'flex';
}

function closeModal(e) { if(e.target.id==='modal') document.getElementById('modal').style.display='none'; }

function updatePreview() {
  if(!editingProduct) return;
  const tempCosts = { realCost: Number(document.getElementById('inpCost').value)||0, storage: Number(document.getElementById('inpStorage').value)||0, ads: Number(document.getElementById('inpAds').value)||0, dailySales: Number(document.getElementById('inpDailySales').value)||0 };
  const price = editingProduct.price || 0;
  const commission = price * getCommission(editingProduct.category) / 100;
  const logistics = getLogistics(editingProduct.gab);
  const profit = price - commission - logistics - tempCosts.storage - tempCosts.ads - tempCosts.realCost;
  const margin = price > 0 ? (profit/price*100).toFixed(1) : 0;
  document.getElementById('profitPreview').innerHTML = `
    <div style="font-size:10px;color:var(--muted);font-weight:700;margin-bottom:8px;letter-spacing:1px">HISOB-KITOB</div>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--muted)">Komissiya (${getCommission(editingProduct.category)}%)</span><span style="color:var(--red)">-${fmt(commission)}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--muted)">Logistika</span><span style="color:var(--red)">-${fmt(logistics)}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;border-top:1px solid var(--border);padding-top:6px;margin-top:4px">
      <span>Sof foyda/dona</span>
      <span style="color:${profit>0?'var(--green)':'var(--red)'}">${fmt(profit)} so'm (${margin}%)</span>
    </div>`;
}

function saveCosts() {
  if(!editingProduct) return;
  costs[editingProduct.id] = {
    realCost: Number(document.getElementById('inpCost').value)||0,
    storage: Number(document.getElementById('inpStorage').value)||0,
    ads: Number(document.getElementById('inpAds').value)||0,
    homeStock: Number(document.getElementById('inpHomeStock').value)||0,
    dailySales: Number(document.getElementById('inpDailySales').value)||0
  };
  localStorage.setItem('uzum_costs', JSON.stringify(costs));
  document.getElementById('modal').style.display = 'none';
  renderCurrentTab();
}

// NOTIFICATIONS
function renderNotifs() {
  const fp = getFiltered();
  const notifs = [];
  fp.forEach(p => {
    const s = getStatus(p);
    const calc = calcProfit(p);
    if(p.stock === 0) notifs.push({ type:'danger', text:`❌ ${p.name.substring(0,30)} — tugagan! Zudlik bilan buyurtma qiling` });
    else if(s === 'critical') notifs.push({ type:'danger', text:`🔴 ${p.name.substring(0,30)} — ${p.stock} dona qoldi, kritik!` });
    else if(s === 'low') notifs.push({ type:'warning', text:`⚠️ ${p.name.substring(0,30)} — kam qoldi` });
    if(calc.needOrder) notifs.push({ type:'info', text:`🚢 ${p.name.substring(0,25)} — ${calc.daysLeft} kunda tugaydi, Xitoydan buyurtma qiling!` });
    if(calc.profit < 0 && costs[p.id]?.realCost) notifs.push({ type:'danger', text:`💸 ${p.name.substring(0,25)} — zarar! Narxni ko'taring` });
  });

  document.getElementById('notifCount').textContent = notifs.length > 0 ? notifs.length+' ' : '';

  document.getElementById('content').innerHTML = `
    <div class="fade">
      ${notifs.length === 0 ? `
      <div style="text-align:center;padding:40px 0">
        <div style="font-size:48px">🎉</div>
        <div style="font-size:15px;font-weight:700;color:var(--green);margin-top:12px">Hamma yaxshi!</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">Hozircha ogohlantirishlar yo'q</div>
      </div>` : notifs.map(n => `
      <div class="notif notif-${n.type}">
        <div class="notif-dot-el" style="background:${n.type==='danger'?'var(--red)':n.type==='warning'?'var(--yellow)':'var(--blue)'}"></div>
        <div class="notif-text" style="color:${n.type==='danger'?'var(--red)':n.type==='warning'?'var(--yellow)':'var(--blue)'}">${n.text}</div>
      </div>`).join('')}
    </div>`;
}

// AI CHAT
function renderAI() {
  document.getElementById('chatInputBar').style.display = 'flex';
  document.getElementById('content').innerHTML = `
    <div class="fade">
      <div class="quick-btns">
        ${['Bugun nima qilishim kerak?','Qaysi tovar muammoli?','Xitoydan nima buyurtma qilay?','Savdoni qanday oshiraman?','Zarar beruvchi tovarlar?'].map(q => 
          `<button class="quick-btn" onclick="sendAI('${q}')">${q}</button>`
        ).join('')}
      </div>
      <div class="chat-container" id="chatMessages">
        ${aiMessages.map(m => m.role==='user' ? 
          `<div class="msg"><div class="msg-bubble">${m.text}</div></div>` :
          `<div class="msg bot"><div class="msg-avatar">🤖</div><div class="msg-bubble">${m.text}</div></div>`
        ).join('')}
        ${aiLoading ? `<div class="msg bot"><div class="msg-avatar">🤖</div><div class="msg-bubble" style="padding:14px 18px"><div style="display:flex;gap:5px">${[0,1,2].map(i=>`<div class="typing-dot" style="animation-delay:${i*.2}s"></div>`).join('')}</div></div></div>` : ''}
      </div>
    </div>`;
  document.getElementById('chatMessages')?.lastElementChild?.scrollIntoView({ behavior:'smooth' });
}

async function sendAI(customMsg) {
  const msg = customMsg || document.getElementById('chatInput')?.value?.trim();
  if(!msg || aiLoading) return;
  if(document.getElementById('chatInput')) document.getElementById('chatInput').value = '';
  
  aiMessages.push({ role:'user', text:msg });
  aiLoading = true;
  renderAI();

  const fp = getFiltered();
  const summary = fp.slice(0,20).map(p => {
    const c = costs[p.id] || {};
    const calc = calcProfit(p);
    return { nomi:p.name, zaxira:p.stock, kunlik_sotuv:c.dailySales||'?', qolgan_kun:calc.daysLeft||'?', buyurtma_kerak:calc.needOrder?'HA':'Yoq', tannarx:c.realCost||'?', sof_foyda:calc.profit||'?', margin:calc.margin+'%' };
  });

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514', max_tokens:800,
        system:`Sen Uzum Market sotuvchisi uchun AI maslahatchi. O'zbek tilida qisqa va amaliy javob ber.\n\nTovarlar: ${JSON.stringify(summary)}\n\nQoidalar: aniq raqamlar bilan gapir, 28 kunlik Xitoy yetkazib berishni hisobga ol, 200 so'zdan oshirma.`,
        messages: [...aiMessages.slice(-6).map(m=>({role:m.role==='bot'?'assistant':'user',content:m.text})), {role:'user',content:msg}]
      })
    });
    const d = await resp.json();
    aiMessages.push({ role:'bot', text: d.content?.map(c=>c.text||'').join('') || 'Xatolik yuz berdi.' });
  } catch { aiMessages.push({ role:'bot', text:'Tarmoq xatoligi. Qayta urinib ko\'ring.' }); }
  
  aiLoading = false;
  renderAI();
}

// INIT
fetchData();
setInterval(fetchData, 5 * 60 * 1000); // 5 daqiqada yangilash
</script>
