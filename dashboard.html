<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Uzum Market Seller Mini App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#00ffa3',
            brandDark: '#00cc82',
            darkBg: '#0b0f19',
            darkCard: '#151c2c',
            darkBorder: '#1e293b'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    .accent-glow {
      box-shadow: 0 0 15px rgba(0, 255, 163, 0.15);
    }
    .badge-glow {
      box-shadow: 0 0 8px rgba(0, 255, 163, 0.4);
    }
  </style>
</head>
<body class="safe-top safe-bottom select-none">

  <!-- Main Container -->
  <div class="max-w-[430px] mx-auto min-h-screen bg-darkBg flex flex-col relative pb-20 border-x border-darkBorder">
    
    <!-- Top Header -->
    <header class="p-4 bg-darkCard border-b border-darkBorder sticky top-0 z-50 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-2.5 h-2.5 rounded-full bg-brand badge-glow animate-pulse"></div>
          <span class="text-xs uppercase tracking-widest text-slate-400 font-mono">UZUM PRO SELLER</span>
        </div>
        <div class="flex items-center gap-2">
          <!-- Refresh button -->
          <button onclick="refreshData()" class="p-1.5 rounded-lg bg-darkBg border border-darkBorder text-slate-300 hover:text-brand transition">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          </button>
          <!-- API Status Badge -->
          <span id="api-status-badge" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 font-mono">
            Demo Mode
          </span>
        </div>
      </div>

      <!-- Shop Selector & Settings -->
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-400">Do'koningizni tanlang:</span>
          <button onclick="toggleModal('shop-settings-modal')" class="text-xs text-brand hover:underline flex items-center gap-1">
            <i data-lucide="settings" class="w-3.5 h-3.5"></i> Do'konlar
          </button>
        </div>
        <!-- Shop Pills Container -->
        <div id="shop-pills" class="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
          <!-- Dynamically populated -->
        </div>
      </div>
    </header>

    <!-- Main Content Area (Dynamic Views) -->
    <main class="flex-1 p-4" id="main-view">
      <!-- Active view content injected here -->
    </main>

    <!-- App Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-darkCard/95 backdrop-blur-md border-t border-darkBorder grid grid-cols-5 py-2 px-1 z-50">
      <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-brand transition py-1">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span class="text-[9px]">Dashboard</span>
      </button>
      <button onclick="switchTab('products')" id="tab-products" class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-brand transition py-1">
        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        <span class="text-[9px]">Kartochkalar</span>
      </button>
      <button onclick="switchTab('inventory')" id="tab-inventory" class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-brand transition py-1">
        <i data-lucide="package" class="w-5 h-5"></i>
        <span class="text-[9px]">Uy Zaxirasi</span>
      </button>
      <button onclick="switchTab('finance')" id="tab-finance" class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-brand transition py-1 py-1">
        <i data-lucide="trending-up" class="w-5 h-5"></i>
        <span class="text-[9px]">Moliya</span>
      </button>
      <button onclick="switchTab('lounge')" id="tab-lounge" class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-brand transition py-1">
        <i data-lucide="bot" class="w-5 h-5"></i>
        <span class="text-[9px]">AI & Bot</span>
      </button>
    </nav>

    <!-- Dynamic Modal System -->
    <div id="modal-container" class="fixed inset-0 bg-black/75 z-[100] flex items-center justify-center p-4 hidden backdrop-blur-sm">
      <div class="bg-darkCard border border-darkBorder rounded-2xl w-full max-w-[380px] accent-glow flex flex-col max-h-[90vh] overflow-hidden">
        <!-- Header -->
        <div class="p-4 border-b border-darkBorder flex items-center justify-between bg-darkBg/50">
          <h3 id="modal-title" class="font-medium text-slate-200">Modal Title</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <!-- Body -->
        <div id="modal-body" class="p-4 overflow-y-auto flex-1">
          <!-- Content injected here -->
        </div>
      </div>
    </div>

  </div>

  <script>
    // State management using elegant LocalStorage bindings
    const defaultShops = [
      { shopId: 61122, shopTitle: "kamera" },
      { shopId: 48589, shopTitle: "Jaydari Bozor" },
      { shopId: 63592, shopTitle: "Nurli" }
    ];

    const defaultProductTypes = [
      { id: 't1', name: 'A9 kamera', stock: 400, cost: 45000 },
      { id: 't2', name: 'X5 kamera', stock: 300, cost: 95000 },
      { id: 't3', name: 'To\'rt burchak', stock: 150, cost: 180000 }
    ];

    const defaultSkuMappings = {
      '5501': 't1', // Mini WiFi Kamera (Oq) -> A9 Kamera
      '5502': 't1', // Yashirin Kamera HD (Qora) -> A9 Kamera
      '5503': 't1', // Kuzatuv WiFi Kamerasi -> A9 Kamera
      '5601': 't2', // X5 Mini -> X5 Kamera
      '5602': 't2', // X5 Portativ -> X5 Kamera
      '5701': 't3', // To'rtburchak Simsiz -> To'rt burchak
      '5702': 't3'  // Kvadrat Kamera -> To'rt burchak
    };

    const defaultCosts = {
      '5501': { budget: 15000, size: 'МГТ' },
      '5502': { budget: 20000, size: 'МГТ' },
      '5503': { budget: 25000, size: 'МГТ' },
      '5601': { budget: 12000, size: 'МГТ' },
      '5602': { budget: 0, size: 'МГТ' },
      '5701': { budget: 8000, size: 'СГТ' },
      '5702': { budget: 22000, size: 'СГТ' }
    };

    let state = {
      shops: JSON.parse(localStorage.getItem('uz_shops')) || defaultShops,
      activeShop: parseInt(localStorage.getItem('uz_active_shop')) || 61122,
      productTypes: JSON.parse(localStorage.getItem('uz_product_types')) || defaultProductTypes,
      skuMappings: JSON.parse(localStorage.getItem('uz_sku_mappings')) || defaultSkuMappings,
      costs: JSON.parse(localStorage.getItem('uz_costs')) || defaultCosts,
      productSettings: JSON.parse(localStorage.getItem('uz_product_settings')) || {}, // 3.4: mahsulot darajasidagi sozlama
      productFilter: localStorage.getItem('uz_product_filter') || 'active', // Kartochkalar filtri: 'active'|'all'|'banned'|'depleted'
      cachedUzumProducts: null,
      orders: [],
      expenses: [],
      returns: [],
      dataErrors: { products: null, orders: null, expenses: null, returns: null },
      unavailableShops: [], // Uzum "Shop is not available" (403) bergan do'kon ID'lari
      activeTab: 'dashboard',
      aiResults: null,
      aiLoading: false,
      skuMetrics: null, // 5.1/5.2/5.4: /api/metrics/:shopId natijasi (joriy do'kon)
      showAllShops: false, // 6.3: Dashboard "Barcha do'konlar" birlashtirilgan ko'rinishi
      allShopsSummary: null,
      allShopsLoading: false
    };

    // FAQAT foydalanuvchi sozlamalarini serverga yuboradi (do'kon/tannarx/bog'lanish).
    // Bu mahsulot fetch'idan MUTLAQO mustaqil — Uzum API xato bersa ham sozlamalar saqlanadi.
    async function syncSettingsToServer() {
      // B (frontend himoya): bo'sh/deyarli bo'sh sozlamani (0 do'kon VA 0 productType) YUBORMAYMIZ —
      // aks holda serverdagi to'liq sozlamani o'chirib yuborishi mumkin.
      if ((state.shops || []).length === 0 && (state.productTypes || []).length === 0) {
        console.warn("[SETTINGS] Bo'sh sozlama — serverga yuborilmadi (himoya).");
        return;
      }
      try {
        await fetch('/api/sync-state', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            productTypes: state.productTypes,
            skuMappings: state.skuMappings,
            costs: state.costs,
            productSettings: state.productSettings,
            shops: state.shops,
            activeShop: state.activeShop
          })
        });
      } catch(e) {
        console.error("Sozlamalarni serverga sync qilish muvaffaqiyatsiz:", e);
      }
    }

    // B: yuklanishda serverdagi sozlamalarni o'qib, localStorage bilan birlashtiradi.
    // Qoida: localStorage bo'sh yoki serverdagidan KAM bo'lsa — serverdagini ishlatadi (ustidan yozmaydi).
    async function loadServerSettings() {
      try {
        const res = await fetch('/api/settings');
        if (!res.ok) return;
        const srv = await res.json();
        let changed = false;
        // Server manba: serverdagi ma'lumot local'dan KAM bo'lmasa (>=) serverni ishlatamiz.
        // Local faqat qat'iy KO'P bo'lsa (hali sync bo'lmagan qo'shimchalar) saqlanadi.
        if ((srv.shops || []).length >= (state.shops || []).length && (srv.shops || []).length > 0) { state.shops = srv.shops; changed = true; }
        if ((srv.productTypes || []).length >= (state.productTypes || []).length && (srv.productTypes || []).length > 0) { state.productTypes = srv.productTypes; changed = true; }
        if (Object.keys(srv.skuMappings || {}).length >= Object.keys(state.skuMappings || {}).length && Object.keys(srv.skuMappings || {}).length > 0) { state.skuMappings = srv.skuMappings; changed = true; }
        if (Object.keys(srv.costs || {}).length >= Object.keys(state.costs || {}).length && Object.keys(srv.costs || {}).length > 0) { state.costs = srv.costs; changed = true; }
        if (Object.keys(srv.productSettings || {}).length >= Object.keys(state.productSettings || {}).length && Object.keys(srv.productSettings || {}).length > 0) { state.productSettings = srv.productSettings; changed = true; }
        if (srv.activeShop && !state.shops.find(s => s.shopId === state.activeShop)) { state.activeShop = srv.activeShop; changed = true; }
        if (changed) {
          // faqat localStorage'ni yangilaymiz (serverga qayta yubormaymiz — u allaqachon manba)
          localStorage.setItem('uz_shops', JSON.stringify(state.shops));
          localStorage.setItem('uz_active_shop', state.activeShop);
          localStorage.setItem('uz_product_types', JSON.stringify(state.productTypes));
          localStorage.setItem('uz_sku_mappings', JSON.stringify(state.skuMappings));
          localStorage.setItem('uz_costs', JSON.stringify(state.costs));
          localStorage.setItem('uz_product_settings', JSON.stringify(state.productSettings));
          console.log("[SETTINGS] Serverdagi sozlamalar localStorage'ga birlashtirildi (server to'liqroq edi).");
        }
      } catch (e) {
        console.error("Server sozlamalarini o'qishda xato:", e);
      }
    }

    // To'liq sync — sozlamalar + jonli ma'lumot (refreshData oxirida)
    async function syncStateToServer() {
      try {
        await fetch('/api/sync-state', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            productTypes: state.productTypes,
            skuMappings: state.skuMappings,
            costs: state.costs,
            productSettings: state.productSettings,
            shops: state.shops,
            activeShop: state.activeShop,
            products: state.cachedUzumProducts,
            orders: state.orders,
            expenses: state.expenses
          })
        });
      } catch(e) {
        console.error("Failed to sync client state to Express Server:", e);
      }
    }

    // Same metric logic used by dashboard.html (simulator) and index.js (bot report) — keep both in sync
    function buildReportMetrics(orders, expenses, productTypes, skuMappings, products) {
      const ordersCount = orders.length;
      const soldQty = orders.reduce((acc, o) => acc + (o.quantity || 1), 0);
      const revenue = orders.reduce((acc, o) => acc + (o.price * (o.quantity || 1)), 0);

      let profitSum = 0;
      let unmappedCount = 0;
      orders.forEach(o => {
        const type = productTypes.find(t => t.id === skuMappings[o.skuId]);
        if (type) {
          profitSum += (o.payout || 0) - (type.cost * (o.quantity || 1));
        } else {
          unmappedCount++;
        }
      });

      const withdrawable = orders
        .filter(o => o.status === 'DELIVERED')
        .reduce((acc, o) => acc + (o.payout || 0), 0);

      const expenseByType = { STORAGE: 0, LOGISTICS: 0, MARKETING: 0 };
      expenses.forEach(x => {
        if (expenseByType[x.type] !== undefined) expenseByType[x.type] += x.amount;
      });
      const totalExpenses = expenseByType.STORAGE + expenseByType.LOGISTICS + expenseByType.MARKETING;

      let activeCount = products.length;
      let outOfStockCount = 0;
      let alertCount = 0;
      let blockedCount = 0;
      const urgentItems = [];

      products.forEach(p => {
        if (p.status?.value === 'PERM_BANNED') blockedCount++;
        (p.skuList || []).forEach(sku => {
          const qty = sku.availableAmount;
          if (qty === 0) outOfStockCount++;
          if (qty > 0 && qty < 15) alertCount++;

          const type = productTypes.find(t => t.id === skuMappings[sku.skuId]);
          if (qty === 0 && type && type.stock > 0) {
            urgentItems.push(`${type.name}: ${sku.skuTitle} o'rniga uy zaxirasidan yuboring (Hozir Uzum omborida: 0 dona, Uyda: ${type.stock} dona kutilmoqda)`);
          }
        });
      });

      return { ordersCount, soldQty, revenue, profitSum, unmappedCount, withdrawable, expenseByType, totalExpenses, activeCount, outOfStockCount, alertCount, blockedCount, urgentItems };
    }

    // Builds the exact Telegram report text from live dashboard state (same shape as backend generateReportText)
    function buildReportText() {
      const todayStr = new Date().toISOString().split('T')[0];
      const products = state.cachedUzumProducts || [];
      const m = buildReportMetrics(state.orders, state.expenses, state.productTypes, state.skuMappings, products);

      const urgentSection = m.urgentItems.length
        ? `\n🚨 *ZUDLIK BILAN OMBORGA YUBORING:*\n${m.urgentItems.map(t => `• ${t}`).join('\n')}\n`
        : '';

      return `🟣 *Uzum Pro Dashboard*
Assalomu alaykum!

📅 *${todayStr}* uchun hisobot

📦 Qabul qilingan buyurtmalar: ${m.ordersCount} ta
🛍️ Sotilgan tovarlar: ${m.soldQty} ta
🏦 Daromad: ${m.revenue.toLocaleString('uz-UZ')} so'm
💵 Sof foyda: ${m.profitSum.toLocaleString('uz-UZ')} so'm${m.unmappedCount > 0 ? ` (bog'lanmagan: ${m.unmappedCount} ta buyurtma hisobga kirmadi)` : ''}

💰 Yechib olish mumkin (yetkazilgan buyurtmalar bo'yicha): ${m.withdrawable.toLocaleString('uz-UZ')} so'm

💸 Xarajatlar (jami ${m.totalExpenses.toLocaleString('uz-UZ')} so'm):
  ➤ Logistika: ${m.expenseByType.LOGISTICS.toLocaleString('uz-UZ')} so'm
  ➤ Saqlash: ${m.expenseByType.STORAGE.toLocaleString('uz-UZ')} so'm
  ➤ Marketing: ${m.expenseByType.MARKETING.toLocaleString('uz-UZ')} so'm

📦 Tovarlar holati:
✅ Sotuvda: ${m.activeCount} ta tovar
❌ Ogohlantirish (Tugagan): ${m.outOfStockCount} ta SKU
⚠️ Kam qolgan: ${m.alertCount} ta SKU
🚫 Bloklangan: ${m.blockedCount} ta
${urgentSection}
/start — boshlash
/hisobot — hisobot
/dashboard — mini app ochish`;
    }

    function saveState() {
      localStorage.setItem('uz_shops', JSON.stringify(state.shops));
      localStorage.setItem('uz_active_shop', state.activeShop);
      localStorage.setItem('uz_product_types', JSON.stringify(state.productTypes));
      localStorage.setItem('uz_sku_mappings', JSON.stringify(state.skuMappings));
      localStorage.setItem('uz_costs', JSON.stringify(state.costs));
      localStorage.setItem('uz_product_settings', JSON.stringify(state.productSettings));
      syncSettingsToServer(); // sozlamalar — fetch'dan mustaqil, har doim yuboriladi
    }

    // Helper functions
    function getActiveShopName() {
      const idx = state.shops.find(s => s.shopId === state.activeShop);
      return idx ? idx.shopTitle : 'Uzum Store';
    }

    // 3.1/3.4: Komissiya ustuvorligi — (a) SKU qo'lda, (b) mahsulot qo'lda, (c) SKU/API commissionApi, (d) 18% default.
    // Eski kategoriya-taxmini (17/20/25%) butunlay olib tashlandi — noto'g'ri edi.
    // Qaytaradi: { pct, source } — source: 'sku-manual'|'product-manual'|'api'|'default'
    function resolveCommission(skuId, sku, productId) {
      const c = state.costs[skuId];
      if (c && c.commissionPercent != null && c.commissionPercent !== '') return { pct: Number(c.commissionPercent), source: 'sku-manual' };
      const ps = productId != null ? state.productSettings[productId] : null;
      if (ps && ps.commissionPercent != null && ps.commissionPercent !== '') return { pct: Number(ps.commissionPercent), source: 'product-manual' };
      if (sku && sku.commissionApi != null) return { pct: Number(sku.commissionApi), source: 'api' };
      return { pct: 18, source: 'default' };
    }

    // 4.1: Uzum'ning 2026-05-04'dan beri ishlatayotgan hajm-asosli logistika formulasi.
    // 1 litrgacha 5250 so'm, har qo'shimcha litr +250 so'm, maksimal 50000 so'm. Hajm yuqoriga yaxlitlanadi.
    function logisticsFormula(litr) {
      return Math.min(50000, 5250 + 250 * (Math.ceil(litr) - 1));
    }

    // Hajm manbai ustuvorligi (4.1): SKU qo'lda litr > mahsulot qo'lda litr > Uzum API'ning o'z
    // SKU o'lchami (dimensionMm) > yo'q (chaqiruvchi default 1 litr ishlatadi).
    function resolveVolumeL(skuId, productId, sku) {
      const c = state.costs[skuId];
      if (c && c.volumeL != null && c.volumeL !== '' && Number(c.volumeL) > 0) return { litr: Number(c.volumeL), source: 'sku-volume' };
      const ps = productId != null ? state.productSettings[productId] : null;
      if (ps && ps.volumeL != null && ps.volumeL !== '' && Number(ps.volumeL) > 0) return { litr: Number(ps.volumeL), source: 'product-volume' };
      if (sku && sku.dimensionMm) {
        const { length, width, height } = sku.dimensionMm;
        const litr = (length * width * height) / 1000000;
        if (litr > 0) return { litr, source: 'api-dimension' };
      }
      return null;
    }

    // 3.2/3.4/4.1: Logistika — SKU qo'lda narx > mahsulot qo'lda narx > hajm (qo'lda yoki API) > default (hajm yo'q, 1 litr).
    // Qaytaradi: { val, source, litr? }
    function resolveLogistics(skuId, productId, sku) {
      const c = state.costs[skuId];
      if (c && c.logisticsCost != null && c.logisticsCost !== '') return { val: Number(c.logisticsCost), source: 'sku-manual' };
      const ps = productId != null ? state.productSettings[productId] : null;
      if (ps && ps.logisticsCost != null && ps.logisticsCost !== '') return { val: Number(ps.logisticsCost), source: 'product-manual' };
      const vol = resolveVolumeL(skuId, productId, sku);
      if (vol) return { val: logisticsFormula(vol.litr), source: vol.source, litr: vol.litr };
      return { val: 5250, source: 'default', litr: 1 };
    }

    // 4.2: Saqlash xarajati — 1 litr = 12 so'm/kun, 30 kun. Hajm bo'lmasa 1 litr deb hisoblanadi.
    const STORAGE_SOM_PER_LITER_DAY = 12;
    const STORAGE_DEFAULT_DAYS = 30;
    function resolveStorage(skuId, productId, sku) {
      const vol = resolveVolumeL(skuId, productId, sku);
      const litr = vol ? vol.litr : 1;
      const source = vol ? vol.source : 'default';
      const days = STORAGE_DEFAULT_DAYS;
      return { val: litr * STORAGE_SOM_PER_LITER_DAY * days, source, litr, days };
    }

    // 3.4/3.5: Tannarx manbai ustuvorligi — SKU qo'lda > SKU turi > mahsulot qo'lda > mahsulot turi > bog'lanmagan
    // Qaytaradi: { tannarx, source, type, tracksStock }
    function resolveTannarx(skuId, productId) {
      const skuCost = state.costs[skuId];
      if (skuCost && skuCost.manualCost != null && skuCost.manualCost !== '') {
        return { tannarx: Number(skuCost.manualCost), source: 'sku-manual', type: null, tracksStock: false };
      }
      const skuTypeId = state.skuMappings[skuId];
      if (skuTypeId) {
        const type = state.productTypes.find(t => t.id === skuTypeId);
        if (type) return { tannarx: type.cost, source: 'sku-type', type, tracksStock: true };
      }
      const ps = productId != null ? state.productSettings[productId] : null;
      if (ps) {
        if (ps.manualCost != null && ps.manualCost !== '') return { tannarx: Number(ps.manualCost), source: 'product-manual', type: null, tracksStock: false };
        if (ps.mappedTypeId) {
          const type = state.productTypes.find(t => t.id === ps.mappedTypeId);
          if (type) return { tannarx: type.cost, source: 'product-type', type, tracksStock: true };
        }
      }
      return { tannarx: 0, source: 'unmapped', type: null, tracksStock: false };
    }

    // Manba belgisi: 📦 = mahsulot darajasidan meros, ✏️ = qo'lda kiritilgan (shu darajada)
    function sourceBadge(source) {
      if (source === 'sku-manual') return ' ✏️';
      if (source === 'product-manual') return ' 📦✏️';
      if (source === 'product-type') return ' 📦';
      if (source === 'product-volume') return ' 📦';
      if (source === 'api-dimension') return ' 📐';
      return '';
    }

    // "Asl tovar turi" qatorida ko'rsatiladigan matn (3.4/3.5)
    function tannarxLabel(info) {
      if (info.source === 'sku-manual' || info.source === 'product-manual') {
        return `✍️ Qo'lda: ${info.tannarx.toLocaleString('uz-UZ')} so'm${sourceBadge(info.source)}`;
      }
      if (info.source === 'sku-type' || info.source === 'product-type') {
        return `${info.type.name}${sourceBadge(info.source)}`;
      }
      return "Kanalga bog'lanmagan ⚠️";
    }

    // Berilgan SKU qaysi mahsulotga (productId) tegishli ekanini topadi (Moliya bo'limida kerak)
    function findProductIdForSku(skuId) {
      for (const p of (state.cachedUzumProducts || [])) {
        if ((p.skuList || []).some(s => String(s.skuId) === String(skuId))) return p.productId;
      }
      return null;
    }

    // Berilgan SKU'ning jonli obyektini topadi (dimensionMm/rank uchun kerak — 4.1/5.2)
    function findSkuObjForSku(skuId) {
      for (const p of (state.cachedUzumProducts || [])) {
        const s = (p.skuList || []).find(s => String(s.skuId) === String(skuId));
        if (s) return s;
      }
      return null;
    }

    // SKU'ning zaxira kunlari metrikasi (5.1) — eng ishonchli mavjud ko'rsatkich (30 kunlik, bo'lmasa 7 kunlik)
    function skuStockDays(skuId) {
      const m = state.skuMetrics?.perSku?.[skuId];
      if (!m || !m.canCompute) return null;
      return m.stockDays30 != null ? m.stockDays30 : m.stockDays7;
    }

    // Kartochkalar filtri (Uzum ilovasidagidek): mahsulot berilgan filtrga tushadimi?
    function productMatchesFilter(p, filter) {
      const isBanned = p.status?.value === 'PERM_BANNED';
      const anyInStock = (p.skuList || []).some(s => (s.availableAmount || 0) > 0);
      const allOut = (p.skuList || []).every(s => (s.availableAmount || 0) <= 0);
      switch (filter) {
        case 'active': return !isBanned && anyInStock;   // Sotuvda
        case 'banned': return isBanned;                  // Bloklangan
        case 'depleted': return !isBanned && allOut;     // Tugagan
        case 'urgent-stock':                              // 5.1: tugash arafasida (<7 kun)
          return !isBanned && (p.skuList || []).some(s => { const d = skuStockDays(s.skuId); return d != null && d < 7; });
        case 'rank-a': return (p.skuList || []).some(s => s.rank === 'A'); // 5.2
        case 'rank-c': return (p.skuList || []).some(s => s.rank === 'C'); // 5.2
        case 'all':
        default: return true;                            // Barcha tovarlar
      }
    }

    // Mahsulotning umumiy zaxirasi (barcha SKU'lar yig'indisi)
    function productTotalStock(p) {
      return (p.skuList || []).reduce((acc, s) => acc + (s.availableAmount || 0), 0);
    }

    // Filtrni tanlash: state + localStorage'da saqlanadi, tab almashtirilganda yo'qolmaydi
    function setProductFilter(filter) {
      state.productFilter = filter;
      localStorage.setItem('uz_product_filter', filter);
      renderProducts(document.getElementById('main-view'));
    }

    // Server API Fetcher
    async function fetchFromProxy(endpoint) {
      const headers = {};
      const token = localStorage.getItem('uzum_api_token');
      if (token) {
        headers['Authorization'] = token;
      }
      const response = await fetch(endpoint, { headers });
      const data = await response.json().catch(() => null);
      if (!response.ok) {
        // Backend 502 UZUM_API_ERROR bilan aniq sabab qaytaradi — shuni ko'rsatamiz
        const detail = (data && data.detail) ? data.detail : `HTTP ${response.status}`;
        throw new Error(detail);
      }
      return data;
    }

    function setBadge(state_, cls) {
      const badge = document.getElementById('api-status-badge');
      badge.textContent = state_;
      badge.className = `text-[10px] px-2 py-0.5 rounded-full font-mono ${cls}`;
    }

    async function refreshData() {
      document.getElementById('api-status-badge').classList.add('animate-pulse');
      state.dataErrors = { products: null, orders: null, expenses: null, returns: null };

      // Sozlamalarni AVVAL, fetch'lardan oldin yuboramiz — Uzum API xato bersa ham saqlanadi (barqarorlik)
      syncSettingsToServer();

      // Mahsulotlar — badge asosan shu chaqiruvga qarab belgilanadi
      try {
        const pData = await fetchFromProxy(`/api/uzum/product/shop/${state.activeShop}`);
        state.cachedUzumProducts = pData.payload || [];
        // Do'kon ishlaydi — agar avval "mavjud emas" deb belgilangan bo'lsa, olib tashlaymiz
        state.unavailableShops = state.unavailableShops.filter(id => id !== state.activeShop);
        if (pData.source === 'live') {
          setBadge('Live Connected', 'bg-emerald-950/80 border border-emerald-500/50 text-emerald-300 badge-glow');
        } else {
          setBadge('Demo Mode', 'bg-slate-800 border border-slate-700 text-slate-300');
        }
      } catch (e) {
        console.error("Mahsulotlarni yuklashda xato:", e);
        state.cachedUzumProducts = null;
        state.dataErrors.products = e.message;
        // Uzum "Shop is not available" bersa — do'konni "mavjud emas" deb belgilaymiz
        if (/not available|forbidden|403/i.test(e.message || '') && !state.unavailableShops.includes(state.activeShop)) {
          state.unavailableShops.push(state.activeShop);
        }
        setBadge("⚠️ Ma'lumot yo'q", 'bg-rose-950/80 border border-rose-500/50 text-rose-300');
      }

      // Sana oralig'i: oxirgi 30 kun
      const dateTo = new Date().toISOString().split('T')[0];
      const dateFrom = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
      const financeQuery = `shopIds=${state.activeShop}&dateFrom=${dateFrom}&dateTo=${dateTo}`;

      // Har bir bo'lim mustaqil yuklanadi — bittasi qulasa, boshqalari baribir urinib ko'radi
      try {
        const oData = await fetchFromProxy(`/api/uzum/finance/orders?${financeQuery}`);
        state.orders = oData.payload?.orders || [];
      } catch (e) {
        console.error("Buyurtmalarni yuklashda xato:", e);
        state.orders = [];
        state.dataErrors.orders = e.message;
      }

      try {
        const eData = await fetchFromProxy(`/api/uzum/finance/expenses?${financeQuery}`);
        state.expenses = eData.payload || [];
      } catch (e) {
        console.error("Xarajatlarni yuklashda xato:", e);
        state.expenses = [];
        state.dataErrors.expenses = e.message;
      }

      try {
        // 2.4: HAQIQIY mijoz qaytarishlari (/v1/return) — client-side shopId filtri
        const rData = await fetchFromProxy(`/api/uzum/return?shopId=${state.activeShop}`);
        state.returns = rData.payload || [];
      } catch (e) {
        console.error("Qaytarishlarni yuklashda xato:", e);
        state.returns = [];
        state.dataErrors.returns = e.message;
      }

      try {
        // 5.1/5.2/5.4: zaxira kunlari, ABC, Xitoy buyurtma nuqtasi — snapshot tarixidan (server hisoblaydi)
        state.skuMetrics = await fetchFromProxy(`/api/metrics/${state.activeShop}`);
      } catch (e) {
        console.error("Metrikalarni yuklashda xato:", e);
        state.skuMetrics = null;
      }

      syncStateToServer();
      renderShopPills();
      switchTab(state.activeTab); // Re-renders current active tab with fresh loads
      document.getElementById('api-status-badge').classList.remove('animate-pulse');
      lucide.createIcons();
    }

      const idInput = document.getElementById('new-shop-id');
      const titleInput = document.getElementById('new-shop-title');
      const id = parseInt(idInput.value);
      const title = titleInput.value.trim();

      const current = state.shops.find(s => s.shopId === shopId);
      if (!current) return;
      const newTitle = prompt("Do'kon uchun yangi nom kiriting:", current.shopTitle);
      if (newTitle && newTitle.trim()) {
        current.shopTitle = newTitle.trim();
        saveState();
        toggleModal('shop-settings-modal'); // Refresh
        refreshData();
      }
    }

    function deleteShop(shopId) {
      if (confirm("Haqiqatan ham ushbu do'konni o'chirmoqchimisiz?")) {
        state.shops = state.shops.filter(s => s.shopId !== shopId);
        if (state.activeShop === shopId && state.shops.length > 0) {
          state.activeShop = state.shops[0].shopId;
        }
        saveState();
        toggleModal('shop-settings-modal'); // Refresh
        refreshData();
      }
    }

    // 4.1: uzunlik/kenglik/balandlik (sm) → hajm (litr) avtomatik hisoblash: (u×k×b)/1000
    function calcVolumeFromDims() {
      const l = parseFloat(document.getElementById('sku-dim-l').value) || 0;
      const w = parseFloat(document.getElementById('sku-dim-w').value) || 0;
      const h = parseFloat(document.getElementById('sku-dim-h').value) || 0;
      if (l <= 0 || w <= 0 || h <= 0) return alert("Uzunlik, kenglik va balandlikni kiriting (sm).");
      const litr = (l * w * h) / 1000;
      document.getElementById('sku-volume-input').value = litr.toFixed(2);
    }

    // Tannarx select'ida "Qo'lda kiritish" tanlanganda tannarx maydonini ko'rsatadi/yashiradi

      const val = document.getElementById('sku-map-select').value;
      document.getElementById('sku-manual-cost-wrap').style.display = val === '__manual__' ? '' : 'none';

    // 3.4/3.5: SKU (mode='sku') yoki mahsulot (mode='product') darajasidagi sozlamani saqlaydi
    function saveCostModal() {
      const body = document.getElementById('modal-body');
      const mode = body.dataset.mode;
      const targetId = body.dataset.targetId;

      const selectedValue = document.getElementById('sku-map-select').value;
      const budget = parseInt(document.getElementById('sku-ad-input').value) || 0;
      const comRaw = document.getElementById('sku-commission-input').value.trim();
      const logRaw = document.getElementById('sku-logistics-input').value.trim();
      const volRaw = document.getElementById('sku-volume-input').value.trim();
      const isManual = selectedValue === '__manual__';
      const manualCostInput = document.getElementById('sku-manual-cost-input');
      const manualCostRaw = (isManual && manualCostInput) ? manualCostInput.value.trim() : '';
      const manualCost = (isManual && manualCostRaw !== '') ? Number(manualCostRaw) : null;

      const commissionPercent = comRaw === '' ? null : Number(comRaw);
      const logisticsCost = logRaw === '' ? null : Number(logRaw);
      const volumeL = volRaw === '' ? null : Number(volRaw);

      if (mode === 'sku') {
        if (isManual) {
          delete state.skuMappings[targetId]; // manual va turga bog'lash bir-birini istisno qiladi
        } else if (selectedValue) {
          state.skuMappings[targetId] = selectedValue;
        } else {
          delete state.skuMappings[targetId];
        }
        state.costs[targetId] = { budget, commissionPercent, logisticsCost, manualCost, volumeL };
      } else {
        // 3.4: mahsulot darajasi — barcha ranglarga tarqaladi (4.1: hajm ham meros bo'ladi)
        state.productSettings[targetId] = {
          mappedTypeId: isManual ? null : (selectedValue || null),
          manualCost,
          budget,
          commissionPercent,
          logisticsCost,
          volumeL
        };
      }
      saveState();
      closeModal();
      refreshData();
    }

    // Product types management
    function saveProductType(editId) {
      const name = document.getElementById('type-name').value.trim();
      const cost = parseInt(document.getElementById('type-cost').value);
      const stock = parseInt(document.getElementById('type-stock').value) || 0;

      if (!name || isNaN(cost)) return alert("Iltimos nomi va haqiqiy tannarxini to'ldiring!");

      if (editId) {
        const item = state.productTypes.find(t => t.id === editId);
        if (item) {
          item.name = name;
          item.cost = cost;
          item.stock = stock;
        }
      } else {
        const newType = {
          id: 't_' + Date.now(),
          name,
          cost,
          stock
        };
        state.productTypes.push(newType);
      }
      saveState();
      closeModal();
      switchTab('inventory');
    }

    function deleteProductType(id) {
      if (confirm("Haqiqatan ham ushbu zaxira tovarini o'chirib yuborsiz? Barcha bog'lovlar yo'qoladi.")) {
        state.productTypes = state.productTypes.filter(t => t.id !== id);
        // Clear mapping orphaned references
        for (const sku in state.skuMappings) {
          if (state.skuMappings[sku] === id) {
            delete state.skuMappings[sku];
          }
        }
        saveState();
        switchTab('inventory');
      }
    }

                <!-- ROI alerts -->
                ${noSalesWithSpend ? `

          return `

      // Filtr tugmalari uchun sonlar (butun ro'yxat bo'yicha, qidiruvdan mustaqil)

      const filterButtons = filterDefs.map(f => {
        const selected = f.key === activeFilter;
        const count = allProducts.filter(p => productMatchesFilter(p, f.key)).length;

      root.innerHTML = `

            ${searchVal ? `
              <button onclick="document.getElementById('product-search-input').value=''; renderProducts(document.getElementById('main-view'))" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>

      let totalQty = 0;

      const typesList = state.productTypes.map(t => {
        const itemVal = t.stock * t.cost;

        return `
          <div class="p-3.5 rounded-2xl bg-darkCard border border-darkBorder flex flex-col gap-2.5">

                  <i data-lucide="edit" class="w-3.5 h-3.5"></i>

                <button onclick="deleteProductType('${t.id}')" class="p-1 px-1.5 text-xs text-rose-400 bg-rose-950/20 border border-rose-900/40 rounded-md hover:text-rose-300 transition flex items-center gap-1">

              <div class="flex flex-col gap-0.5">

              <div class="flex flex-col gap-0.5 col-span-2 border-t border-darkBorder pt-2 flex justify-between flex-row">

      root.innerHTML = `

          <div class="p-4 rounded-2xl bg-darkCard border border-darkBorder flex flex-col gap-1 inline-block">

    // UI Panel: FINANCE & ACCOUNTING
    function renderFinance(root) {
      try {
        renderFinanceUnsafe(root);
      } catch (err) {
        showRenderError(root, 'Moliya', err);
      }
    }

    function renderFinanceUnsafe(root) {
      // Calculate realistic financial figures
      let totalSales = 0;
      let totalPayout = 0;
      let totalComsVal = 0;
      let totalShipping = 0;
      let totalStorage = 0;
      let totalMarketingVal = 0;
      let totalMappedCostSum = 0;

      // Feed from fallback or real API values
      const unitsSoldBySku = {};
      state.orders.forEach(o => {
        unitsSoldBySku[o.skuId] = (unitsSoldBySku[o.skuId] || 0) + (o.quantity || 1);
      });

      state.orders.forEach(o => {
        totalSales += o.price * (o.quantity || 1);
        totalPayout += o.payout || (o.price * 0.8);

        const productIdForSku = findProductIdForSku(o.skuId);
        const tInfo = resolveTannarx(o.skuId, productIdForSku); // 3.4/3.5: SKU/mahsulot qo'lda yoki turi
        if (tInfo.source !== 'unmapped') {
          totalMappedCostSum += tInfo.tannarx * (o.quantity || 1);
        } else {
          totalMappedCostSum += 45000 * (o.quantity || 1); // fallback
        }

        const skuObjForOrder = findSkuObjForSku(o.skuId);
        totalShipping += resolveLogistics(o.skuId, productIdForSku, skuObjForOrder).val * (o.quantity || 1); // 3.2/3.4/4.1: qo'lda yoki hajmdan
        totalStorage += resolveStorage(o.skuId, productIdForSku, skuObjForOrder).val * (o.quantity || 1); // 4.2: saqlash
      });

      // Reklama: kunlik byudjet * 30 kun, faqat shu SKU oxirgi 30 kunda sotilgan bo'lsa hisoblanadi
      const noSaleAdSpendSkus = [];
      Object.keys(state.costs).forEach(skuId => {
        const dailyBudget = state.costs[skuId].budget || 0;
        if (dailyBudget <= 0) return;
        const unitsSold = unitsSoldBySku[skuId] || 0;
        if (unitsSold > 0) {
          totalMarketingVal += dailyBudget * 30;
        } else {
          noSaleAdSpendSkus.push(skuId);
        }
      });

      // 5.3: Nolikvid — oxirgi 30 kunda sotilmagan + hozir zaxirasi bor (server snapshot tarixidan aniqlagan)
      const deadStockItems = [];
      (state.cachedUzumProducts || []).forEach(p => (p.skuList || []).forEach(sku => {
        const m = state.skuMetrics?.perSku?.[sku.skuId];
        if (m && m.isDeadStock) {
          const tInfo = resolveTannarx(sku.skuId, p.productId);
          const stor = resolveStorage(sku.skuId, p.productId, sku);
          const tiedCapital = tInfo.tannarx * sku.availableAmount;
          const dailyWaste = (stor.val / stor.days) * sku.availableAmount;
          deadStockItems.push({ title: sku.skuTitle, qty: sku.availableAmount, tiedCapital, dailyWaste });
        }
      }));
      const totalDeadCapital = deadStockItems.reduce((a, i) => a + i.tiedCapital, 0);
      const totalDeadDaily = deadStockItems.reduce((a, i) => a + i.dailyWaste, 0);

      // 2.3: real Uzum xarajatlarini SOURCE bo'yicha guruhlaymiz (type=OUTCOME/INCOME).
      // Eski STORAGE/MARKETING tasnifi real ma'lumotda hech qachon ishlamasdi — kategoriya o'ylab topilmaydi.
      const realExpensesBySource = {};
      let realExpensesTotal = 0, realIncomeTotal = 0;
      state.expenses.forEach(x => {
        const amt = (x.amount != null ? x.amount : (x.paymentPrice || 0)) || 0;
        if (x.type === 'INCOME') { realIncomeTotal += amt; return; }
        const src = x.source || x.name || 'Boshqa';
        realExpensesBySource[src] = (realExpensesBySource[src] || 0) + amt;
        realExpensesTotal += amt;
      });

      // 4.3: yagona formula — payout allaqachon komissiyani chegirib bergan, shunga logistika/saqlash/reklama/tannarx qo'shimcha chegiriladi
      const totalProfit = totalPayout - totalShipping - totalStorage - totalMarketingVal - realExpensesTotal - totalMappedCostSum;
      const profitColor = totalProfit >= 0 ? 'text-brand' : 'text-rose-400';

      root.innerHTML = `
        <div class="flex flex-col gap-5">

          ${state.dataErrors?.orders ? dataErrorBanner('Buyurtmalar — ' + state.dataErrors.orders) : ''}
          ${state.dataErrors?.expenses ? dataErrorBanner('Xarajatlar — ' + state.dataErrors.expenses) : ''}
          ${state.dataErrors?.returns ? dataErrorBanner('Qaytarishlar — ' + state.dataErrors.returns) : ''}

          <!-- Balance Widget — Uzum Seller API'da balans/yechib olish endpointi yo'q, shuning uchun bu yerda soxta raqam ko'rsatilmaydi -->
          <div class="bg-gradient-to-br from-brand/10 to-brand/5 border border-brand/20 rounded-3xl p-5 relative overflow-hidden accent-glow">
            <div class="absolute -right-10 -bottom-10 opacity-5">
              <i data-lucide="gem" class="w-32 h-32 text-brand"></i>
            </div>
            <span class="text-xs text-brand uppercase tracking-wider font-mono">UZUM BANK BALANSI (Shop ID: ${state.activeShop})</span>
            <div class="text-xs text-slate-400 mt-2">⚠️ Bu ma'lumot Uzum API'da mavjud emas (balans endpointi yo'q)</div>
            <div class="text-[10px] text-slate-500 mt-1">Pastdagi "Kutilayotgan Payout" — buyurtmalar asosida hisoblangan taxmin, Uzum'ning rasmiy balansi emas.</div>
          </div>

          <!-- Sales Profit analysis -->
          <div class="bg-darkCard border border-darkBorder rounded-2xl p-4 flex flex-col gap-3">
            <div class="flex items-center justify-between border-b border-darkBorder pb-2.5">
              <span class="text-xs uppercase font-bold text-slate-300 tracking-wider">Oylik Sotuv & Moliya Hisobi</span>
              <span class="text-[10px] text-slate-500 font-mono">Period: 30 kun</span>
            </div>

            <div class="flex flex-col gap-2 font-medium">
              <div class="flex justify-between text-xs py-1">
                <span class="text-slate-400">Jami Buyurtmalar Savdosi:</span>
                <span class="text-slate-100 font-mono">${totalSales.toLocaleString()} so'm</span>
              </div>
              <div class="flex justify-between text-xs py-1">
                <span class="text-slate-400">Kutilayotgan Payout (Uzumdan):</span>
                <span class="text-slate-100 font-mono font-bold">${totalPayout.toLocaleString()} so'm</span>
              </div>
              <div class="flex justify-between text-xs py-1">
                <span class="text-slate-400">Hisoblangan Tannarx (Xarid):</span>
                <span class="text-slate-100 font-mono">${totalMappedCostSum.toLocaleString()} so'm</span>
              </div>
              <div class="flex justify-between text-xs py-1">
                <span class="text-slate-400">Logistika (hajm asosida, 4.1):</span>
                <span class="text-slate-100 font-mono">${totalShipping.toLocaleString()} so'm</span>
              </div>
              <div class="flex justify-between text-xs py-1">
                <span class="text-slate-400">Saqlash (hajm × 12 so'm × 30 kun, 4.2):</span>
                <span class="text-slate-100 font-mono">${totalStorage.toLocaleString()} so'm</span>
              </div>
              <div class="flex justify-between text-xs py-1">
                <span class="text-slate-400">Marketing & Reklama (byudjet):</span>
                <span class="text-slate-100 font-mono">${totalMarketingVal.toLocaleString()} so'm</span>
              </div>
              <!-- 2.3: real Uzum xarajatlari source bo'yicha (kategoriya o'ylab topilmaydi) -->
              <div class="border-t border-darkBorder/40 pt-2 mt-1">
                <div class="text-[10px] uppercase text-slate-500 mb-1">Uzum xarajatlari (oxirgi 30 kun):</div>
                ${Object.keys(realExpensesBySource).length === 0
                  ? `<div class="text-[10.5px] text-slate-500">Bu davrda xarajat yozuvi yo'q</div>`
                  : Object.entries(realExpensesBySource).sort((a,b)=>b[1]-a[1]).map(([src,amt])=>`
                    <div class="flex justify-between text-[10.5px] py-0.5">
                      <span class="text-slate-400">${src}</span>
                      <span class="text-slate-300 font-mono">${amt.toLocaleString()} so'm</span>
                    </div>`).join('')}
                ${realIncomeTotal ? `<div class="flex justify-between text-[10.5px] py-0.5 text-emerald-400 border-t border-darkBorder/30 mt-1 pt-1"><span>Kirim (INCOME)</span><span class="font-mono">${realIncomeTotal.toLocaleString()} so'm</span></div>` : ''}
              </div>
              ${noSaleAdSpendSkus.length > 0 ? `
                <div class="flex items-start gap-1.5 text-[10.5px] text-amber-400 bg-amber-950/20 border border-amber-900/40 rounded-lg px-2 py-1.5">
                  <span>⚠️</span>
                  <span>Reklama ketyapti, sotuv yo'q — to'xtating yoki tekshiring (${noSaleAdSpendSkus.length} ta SKU)</span>
                </div>
              ` : ''}
              <div class="flex justify-between text-sm py-2 border-t border-darkBorder/40 mt-1.5">
                <span class="text-slate-300 font-bold uppercase text-[11px] tracking-wider">Hisoblangan Sof Foyda:</span>
                <span class="font-black font-mono text-xs ${profitColor}">${totalProfit.toLocaleString()} so'm</span>
              </div>
            </div>
          </div>

          <!-- 5.3: Nolikvid (muzlagan kapital) widget -->
          <div class="bg-darkCard border border-darkBorder rounded-2xl p-4">
            <div class="flex items-center justify-between mb-3 border-b border-darkBorder pb-2.5">
              <span class="text-xs uppercase font-bold text-slate-300 tracking-wider">❄️ Nolikvid (muzlagan kapital)</span>
              <span class="text-[10px] font-mono font-bold text-amber-400">${deadStockItems.length} ta SKU</span>
            </div>
            ${!state.skuMetrics?.ready30 ? `
              <div class="text-[11px] text-slate-500 text-center py-2">Hisoblab bo'lmaydi — snapshot tarixi hali 30 kunlik emas</div>
            ` : deadStockItems.length === 0 ? `
              <div class="text-[11px] text-slate-500 text-center py-2">Nolikvid tovar topilmadi — hammasi oxirgi 30 kunda sotilgan</div>
            ` : `
              <div class="flex flex-col gap-2 max-h-[160px] overflow-y-auto mb-2.5">
                ${deadStockItems.map(i => `
                  <div class="p-2 py-1.5 rounded-lg bg-darkBg border border-darkBorder flex items-center justify-between text-[11px] gap-2">
                    <div class="flex flex-col min-w-0">
                      <span class="font-semibold text-slate-300 truncate">${i.title}</span>
                      <span class="text-[9.5px] text-slate-500">${i.qty} dona</span>
                    </div>
                    <span class="font-mono text-amber-400 text-right font-bold shrink-0">${i.tiedCapital.toLocaleString()} s.</span>
                  </div>

    // Simulator handler
    function simulateTgCommand(command) {
      const box = document.getElementById('sim-message-box');
      
      // Add User's bubble
      box.innerHTML += `
        <div class="p-2 px-3 rounded-2xl bg-brand/10 border border-brand/35 text-[11px] text-brand self-end max-w-[85%] font-mono my-1">
          ${command}
        </div>
      `;

      // Sim response delay
      setTimeout(() => {
        let reply = "";
        if (command === '/start') {
          reply = `🟣 *Uzum Pro Dashboard* \n\nAssalomu alaykum! Sokin kiritshingiz muvaffaqiyatli sodir bo'ldi. Men sizning Uzum sotuvchi yordamchingizmi.\n\nFoydalanish uchun buyruqlar:\n/hisobot — Kunlik savdo va moliya hisoboti\n/dashboard — Mini App darchasiga kirish`;
        } else if (command === '/hisobot') {
          reply = buildReportText();
        }

        // Output Bot Bubble
        box.innerHTML += `
          <div class="flex items-start gap-2 max-w-[85%] self-start my-1.5">
            <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center font-bold text-[10px] text-slate-100 shrink-0">BOT</div>
            <div class="p-2 px-3 rounded-2xl bg-darkCard border border-darkBorder text-[11px] text-slate-300 leading-normal whitespace-pre-line font-medium shadow">
              ${reply}
            </div>
          </div>
        `;
        box.scrollTop = box.scrollHeight;
      }, 500);
    }

    // Call server Gemini Advisor API
    async function askGeminiAdvice() {
      const btn = document.getElementById('gemini-trigger-btn');
      btn.disabled = true;
      btn.innerHTML = `<i class="w-4 h-4 animate-spin inline-block mr-1"></i> Tahlil qilinmoqda (Gemini AI)...`;
      
      try {
        const payload = {
          currentInventory: state.cachedUzumProducts,
          activeProductTypes: state.productTypes,
          currentSales: state.orders,
          activeShopTitle: getActiveShopName()
        };

        const response = await fetch('/api/gemini/advice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errRes = await response.json();
          throw new Error(errRes.error || "Gemini API failed");
        }

        const data = await response.json();
        state.aiResults = data;
        
        document.getElementById('ai-results-panel').classList.remove('hidden');
        selectAiTab('bugun');
      } catch (err) {
        alert(err.message || "Xatolik yuz berdi. Qayta urinib ko'ring.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="brain-circuit" class="w-4 h-4"></i> "Bugun nima qilishim kerak?" va AI Tahlil`;
        lucide.createIcons();
      }
    }

    function selectAiTab(key) {
      if (!state.aiResults) return;
      
      const subTabs = ['bugun', 'ombor', 'reklama', 'sotuv_pasayishi', 'xitoy_buyurtmasi', 'eng_yaxshi'];
      subTabs.forEach(t => {
        const btn = document.getElementById(`ai-btn-${t}`);
        if (btn) {
          if (t === key) {
            btn.className = "px-2.5 py-1.5 text-[10.5px] text-darkBg bg-brand border border-brand/50 rounded-lg font-bold font-sans";
          } else {
            btn.className = "px-2.5 py-1.5 text-[10.5px] text-slate-400 bg-darkBg border border-darkBorder rounded-lg hover:text-brand font-semibold font-sans";
          }
        }
      });

      const titleMap = {
        bugun: "1. BUGUN NIMA QILISH KERAK?",
        ombor: "2. QAYSI KARTOCKHAGA TOVAR YUBORISH REJASI",
        reklama: "3. REKLAMA BYUDJETI VA ROI TAHLILI",
        sotuv_pasayishi: "4. SOTILISHI PASAYIB KETAYOTGAN SKUlar",
        xitoy_buyurtmasi: "5. XITOYDAN RE-ORDERING REJASI (28 kunga)",
        eng_yaxshi: "6. ENG YAXSHI ISHLAYOTGAN KARTOCKHALAR"
      };

      document.getElementById('ai-selected-title').textContent = titleMap[key] || "Malumotlar";
      document.getElementById('ai-selected-text').innerHTML = state.aiResults[key] || "Matn kutilmoqda...";
    }

    // Secret configurations saving
    function saveBotToken() {
      const field = document.getElementById('tg-token-field');
      const val = field.value.trim();
      localStorage.setItem('tg_bot_token', val);
      alert("Telegram Bot API Token saqlandi. Bog'lov yangilandi.");
    }

    // On Load Boostrapper
    window.addEventListener('DOMContentLoaded', async () => {

      await loadServerSettings();
      refreshData();
    });
